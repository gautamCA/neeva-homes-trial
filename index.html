function act(label,detail='',time=null){return{id:'a'+Math.random().toString(36).slice(2,8),time:time||nowLabel(),label,detail}}
function nowLabel(){return new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit'}).format(new Date())}
function dateLabel(v){if(!v)return 'Not sent';if(v===TODAY)return'Today';if(v===addDaysISO(TODAY,1))return'Tomorrow';const d=new Date(v+'T12:00:00');return new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short'}).format(d)}
function timeLabel(v){const [h,m]=v.split(':').map(Number),d=new Date();d.setHours(h,m);return new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit'}).format(d)}
function uid(p='id'){return `${p}-${Date.now()}-${Math.random().toString(36).slice(2,6)}`}
function hasContact(l){return l.activities.some(a=>a.label==='Contact marked')}
function needsAttention(l){return l.stage==='New'&&!hasContact(l)}
function stageClass(s){return 'badge '+(s==='New'?'neutral':s==='Won'?'ok':s==='Proposal'?'proposal':'dark')}

 ${l.proposal?`<section class="panel"><div class="panelHead"><div><p class="sectionKicker">PROPOSAL</p><h2>Proposal status</h2></div><span class="badge proposal">${esc(l.proposal.status)}</span></div><div class="infoGrid">${info('Version','V'+l.proposal.version)}${info('Sent',dateLabel(l.proposal.sent))}${info('Next follow-up',l.proposal.next?dateLabel(l.proposal.next):'None scheduled')}${info('Current stage',l.stage)}</div></section>`:''}
 <section class="panel"><div class="panelHead"><div><p class="sectionKicker">NOTES</p><h2>Working notes</h2></div><span>${l.notes.length} saved</span></div><div class="notes">${l.notes.map(n=>`<div class="savedNote">${esc(n)}</div>`).join('')}<div class="field"><textarea id="noteInput" placeholder="Add a note…"></textarea></div><button class="soft small" id="saveNote">Save note</button></div></section>
 </div><aside class="panel timeline"><div class="panelHead"><div><p class="sectionKicker">HISTORY</p><h2>Activity</h2></div></div><div class="timelineList">${l.activities.map(a=>`<div class="timelineItem"><span class="dot"></span><div><small>${esc(a.time)}</small><strong>${esc(a.label)}</strong>${a.detail?`<p>${esc(a.detail)}</p>`:''}</div></div>`).join('')}</div></aside></div></div>`}
function info(k,v){return `<div class="infoCell"><span>${k}</span><strong>${esc(v??'—')}</strong></div>`}
function followupsPage(){const rows=state.leads.flatMap(l=>l.followUps.map(f=>({l,f}))).filter(({f})=>tab==='Completed'?f.done:tab==='Due today'?!f.done&&f.date===TODAY:!f.done&&f.date>TODAY);return `<div class="page">${head('ACTION QUEUE','Follow-ups','Keep every promised callback visible until it is completed.')}<div class="tabs">${['Due today','Upcoming','Completed'].map(x=>`<button data-tab="${x}" class="${tab===x?'active':''}">${x}</button>`).join('')}</div><div class="cards">${rows.map(({l,f})=>`<article class="panel card"><div class="cardTop"><div><span class="badge neutral">${dateLabel(f.date)}</span><strong style="display:block;margin-top:6px">${timeLabel(f.time)}</strong></div><span class="${stageClass(l.stage)}">${l.stage}</span></div><h3>${esc(l.name)}</h3><p>${esc(l.property)} · ${esc(l.assignee)}</p><div class="reason"><span>Reason</span><strong>${esc(f.note||'Follow up with enquiry')}</strong></div><div class="cardActions">${!f.done?`<button class="primary small" data-done="${l.id}|${f.id}">Mark done</button><button class="soft small" data-reschedule="${l.id}">Reschedule</button>`:''}<button class="textBtn" data-open="${l.id}">Open lead</button></div></article>`).join('')||'<div class="panel" style="padding:28px">Nothing here right now.</div>'}</div></div>`}
function consultationsPage(){const rows=state.leads.flatMap(l=>l.consultations.map(c=>({l,c})));return `<div class="page">${head('MEETINGS','Consultations','Upcoming and completed design conversations in one place.')}<div class="cards">${rows.map(({l,c})=>`<article class="panel card"><div class="cardTop"><span class="badge ${c.completed?'ok':'neutral'}">${c.completed?'Completed':'Upcoming'}</span><span>${dateLabel(c.date)} · ${timeLabel(c.time)}</span></div><h3>${esc(l.name)}</h3><p>${esc(l.property)} · ${esc(l.location)}</p><div class="reason"><span>Mode</span><strong>${esc(c.mode)}${c.note?' · '+esc(c.note):''}</strong></div><button class="textBtn" data-open="${l.id}">Open lead</button></article>`).join('')}</div></div>`}
function automationPage(){return `<div class="page">${head('WORKFLOW RULES','Automation','A preview of the rules that can sit around Neeva Homes’ actual enquiry process.')}<div class="automationGrid">${state.automations.map(a=>`<section class="panel automationCard"><div class="automationTop"><div><p class="sectionKicker">${esc(a.tag)}</p><h3>${esc(a.title)}</h3></div><button class="toggle ${a.enabled?'on':''}" data-auto="${a.id}" aria-label="toggle"><i></i></button></div><p>${esc(a.desc)}</p><div class="ruleMeta"><span class="badge ${a.enabled?'ok':'neutral'}">${a.enabled?'Enabled in trial':'Paused'}</span><span class="badge neutral">Preview rule</span></div></section>`).join('')}</div><section class="panel automationLog"><div class="panelHead"><div><p class="sectionKicker">RECENT ACTIVITY</p><h2>Workflow events</h2></div><span>Generated by trial actions</span></div>${state.logs.slice(0,10).map(x=>`<div class="logRow"><span>${esc(x.time)}</span><div><strong>${esc(x.title)}</strong><p>${esc(x.detail)}</p></div></div>`).join('')}</section></div>`}
function proposalsPage(){const P=state.leads.filter(l=>l.stage==='Proposal'||l.stage==='Won');return `<div class="page">${head('DECISION STAGE','Proposals','Keep proposal status and next follow-up visible after the consultation.')}<section class="panel"><div class="panelHead"><div><p class="sectionKicker">ACTIVE + WON</p><h2>Proposal tracker</h2></div><span>${P.length} sample records</span></div><div class="tableHead" style="grid-template-columns:1.3fr .8fr .8fr 1fr .8fr"><span>Client</span><span>Status</span><span>Version</span><span>Next step</span><span>Owner</span></div>${P.map(l=>`<button class="proposalRow" data-open="${l.id}"><strong>${esc(l.name)}</strong><span class="proposalStatus">${esc(l.proposal?.status||l.stage)}</span><span>${l.proposal?'V'+l.proposal.version:'—'}</span><span>${esc(nextAction(l))}</span><span>${esc(l.assignee)}</span></button>`).join('')}</section></div>`}
function reportsPage(){const L=state.leads;const sources=[...new Set(L.map(l=>l.source))].map(s=>[s,L.filter(l=>l.source===s).length]).sort((a,b)=>b[1]-a[1]);const active=L.filter(l=>l.stage!=='Won');const ages=[['New / untouched',L.filter(needsAttention).length],['Follow-up scheduled',L.filter(l=>l.followUps.some(f=>!f.done)).length],['Consultation',L.filter(l=>l.stage==='Consultation').length],['Proposal',L.filter(l=>l.stage==='Proposal').length]];return `<div class="page">${head('OWNER VISIBILITY','Owner reports','Operational views from the sample workspace, without fabricated revenue or conversion claims.')}<div class="reportGrid"><section class="panel reportCard"><h3>Lead source mix</h3>${sources.map(([s,n])=>`<div class="sourceRow"><span>${esc(s)}</span><div class="metricBar"><i style="width:${n/L.length*100}%"></i></div><strong>${n}</strong></div>`).join('')}<p class="reportNote">Counts reflect only the fictional trial data.</p></section><section class="panel reportCard"><h3>Pipeline attention</h3>${ages.map(([s,n])=>`<div class="ageRow"><span>${esc(s)}</span><div class="metricBar"><i style="width:${Math.max(6,n/active.length*100)}%"></i></div><strong>${n}</strong></div>`).join('')}<p class="reportNote">Designed to show where owner attention is needed, not to claim business performance.</p></section><section class="panel reportCard"><h3>Team ownership</h3>${team.filter(x=>x!=='Unassigned').map(t=>{const n=L.filter(l=>l.assignee===t&&l.stage!=='Won').length;return `<div class="sourceRow"><span>${esc(t)}</span><div class="metricBar"><i style="width:${Math.max(6,n/L.length*100)}%"></i></div><strong>${n}</strong></div>`}).join('')}</section><section class="panel reportCard"><h3>Priority mix</h3>${['High','Medium','Low'].map(p=>{const n=L.filter(l=>l.priority===p&&l.stage!=='Won').length;return `<div class="sourceRow"><span>${p}</span><div class="metricBar"><i style="width:${Math.max(6,n/active.length*100)}%"></i></div><strong>${n}</strong></div>`}).join('')}<p class="reportNote">Priority is illustrative trial data and can be replaced with Neeva Homes’ own criteria.</p></section></div></div>`}
function modalView(){const l=selected?state.leads.find(x=>x.id===selected):modal?.leadId?state.leads.find(x=>x.id===modal.leadId):null;const kind=typeof modal==='string'?modal:modal.kind;let body='',title='';if(kind==='reset'){title='Reset trial data?';body=`<p class="modalLead">Restore the original Neeva Homes sample workspace and guided trial?</p><div class="modalActions"><button class="danger" id="confirmReset">Reset trial</button><button class="ghost" data-close>Cancel</button></div>`}
else if(kind==='contact'&&l){title='Contact outcome';body=`<p class="modalLead">${esc(l.name)}</p><div class="choice">${['Interested','Needs time','No response','Not suitable'].map((x,i)=>`<button data-choice="${x}" class="${i===0?'selected':''}">${x}</button>`).join('')}</div><div class="field"><span>Optional note</span><textarea id="contactNote" placeholder="Add conversation context…"></textarea></div><div class="modalActions"><button class="primary" id="saveContact">Save outcome</button><button class="ghost" data-close>Cancel</button></div>`}
else if(kind==='followup'&&l){title='Schedule follow-up';body=`<div class="quick"><button data-date="${addDaysISO(TODAY,1)}">Tomorrow</button><button data-date="${addDaysISO(TODAY,2)}">In 2 days</button><button data-date="${addDaysISO(TODAY,7)}">Next week</button></div><div class="formRow"><div class="field"><span>Date</span><input id="fuDate" type="date" min="${TODAY}" value="${addDaysISO(TODAY,1)}"></div><div class="field"><span>Time</span><input id="fuTime" type="time" value="11:00"></div></div><div class="field"><span>Reason / note</span><textarea id="fuNote" placeholder="What should happen next?"></textarea></div><div class="modalActions"><button class="primary" id="saveFollowup">Schedule follow-up</button><button class="ghost" data-close>Cancel</button></div>`}
else if(kind==='consultation'&&l){title='Book consultation';body=`<div class="formRow"><div class="field"><span>Date</span><input id="cDate" type="date" min="${TODAY}" value="${addDaysISO(TODAY,1)}"></div><div class="field"><span>Time</span><input id="cTime" type="time" value="15:00"></div></div><div class="field"><span>Mode</span><select id="cMode"><option>Studio</option><option>Site visit</option><option>Video call</option><option>Phone</option></select></div><div class="field"><span>Notes</span><textarea id="cNote" placeholder="Optional consultation context…"></textarea></div><div class="modalActions"><button class="primary" id="saveConsultation">Book consultation</button><button class="ghost" data-close>Cancel</button></div>`}
else if(kind==='assign'&&l){title='Assignment and priority';body=`<p class="modalLead">Set a clear owner and priority for ${esc(l.name)}.</p><div class="formRow"><div class="field"><span>Owner</span><select id="assignOwner">${team.map(t=>`<option ${l.assignee===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><span>Priority</span><select id="assignPriority">${['High','Medium','Low'].map(p=>`<option ${l.priority===p?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="modalActions"><button class="primary" id="saveAssign">Save assignment</button><button class="ghost" data-close>Cancel</button></div>`}
else if(kind==='whatsapp'&&l){title='WhatsApp message preview';body=`<p class="modalLead">Preview only. This trial does not message a real customer.</p><div class="message">Hi ${esc(l.name)}, this is the Neeva Homes team. Thanks for sharing your ${esc(l.property)} interior requirement. We’d love to understand your preferences and discuss the next step.</div><p class="modalLead">In a live setup, this can open the customer conversation or use approved templates around the team’s workflow.</p><div class="modalActions"><button class="primary" id="copyWA">Copy message</button><button class="ghost" data-close>Close</button></div>`}
else if(kind==='add'){title='Add new enquiry';body=`<div class="formRow"><div class="field"><span>Client name</span><input id="aName" placeholder="e.g. Riya & Aman"></div><div class="field"><span>Phone</span><input id="aPhone" placeholder="Optional for trial"></div></div><div class="formRow"><div class="field"><span>Property</span><input id="aProperty" value="2BHK Apartment"></div><div class="field"><span>Area</span><input id="aArea" placeholder="e.g. 1,650 sq ft"></div></div><div class="formRow"><div class="field"><span>Budget</span><input id="aBudget" placeholder="e.g. ₹15L–₹18L"></div><div class="field"><span>Location</span><input id="aLocation" placeholder="Hyderabad"></div></div><div class="formRow"><div class="field"><span>Source</span><select id="aSource"><option>Website enquiry</option><option>Referral</option><option>Instagram</option><option>Phone</option><option>Other</option></select></div><div class="field"><span>Priority</span><select id="aPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></div></div><div class="field"><span>Notes</span><textarea id="aNotes" placeholder="Optional context…"></textarea></div><div class="modalActions"><button class="primary" id="saveAdd">Save enquiry</button><button class="ghost" data-close>Cancel</button></div>`}
else if(kind==='convert'){title='Ready to test this with real Neeva Homes enquiries?';body=`<p class="modalLead">If this workflow is useful, the next step is to map the live version around how Neeva Homes receives, assigns and follows up with actual enquiries.</p><div class="contactCard"><strong>Gautam Govind</strong><span>Founder, Silicon Soul</span><a href="https://siliconsoul.continuumarc.tech" target="_blank" rel="noreferrer">siliconsoul.continuumarc.tech ↗</a></div><div class="modalActions"><button class="primary" id="copySetup">Copy “proceed”</button><a class="ghost linkBtn" href="https://siliconsoul.continuumarc.tech" target="_blank" rel="noreferrer">Visit Silicon Soul</a></div>`}
return `<div class="modalBack" id="modalBack"><div class="modal"><div class="modalHead"><h2>${title}</h2><button class="iconBtn" data-close>×</button></div>${body}</div></div>`}
function bindEntry(){$('#enter').onclick=()=>{entered=true;sessionStorage.setItem(KEYS.entered,'1');app()}}
function bindGlobal(){
 $$('[data-nav]').forEach(b=>b.onclick=()=>{screen=b.dataset.nav;selected=null;app()});
 $('#addEnquiry')?.addEventListener('click',()=>{modal='add';app()});$('#resetBtn')?.addEventListener('click',()=>{modal='reset';app()});$('#mobileReset')?.addEventListener('click',()=>{modal='reset';app()});
 $('#mobileMenuBtn')?.addEventListener('click',()=>$('#mobileMenu').classList.toggle('hidden'));
 $$('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;screen='leads';state.interactions++;save();app()});
 $$('[data-close]').forEach(b=>b.onclick=()=>{modal=null;app()});$('#modalBack')?.addEventListener('click',e=>{if(e.target.id==='modalBack'){modal=null;app()}});
 bindModal();
}
function bindPage(){
 $('#startGuide')?.addEventListener('click',()=>{localStorage.setItem(KEYS.guide,'1');selected='arjun';screen='leads';state.interactions++;save();app()});
 $('#dismissGuide')?.addEventListener('click',()=>{localStorage.setItem(KEYS.guide,'1');app()});
 $('#convertBtn')?.addEventListener('click',()=>{modal='convert';app()});
 $('#addLead2')?.addEventListener('click',()=>{modal='add';app()});
 $('#search')?.addEventListener('input',e=>{search=e.target.value;app()});$('#sort')?.addEventListener('change',e=>{sort=e.target.value;app()});
 $$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;app()});$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;app()});
 $$('[data-done]').forEach(b=>b.onclick=()=>{const [lid,fid]=b.dataset.done.split('|');mutate(lid,l=>({...l,followUps:l.followUps.map(f=>f.id===fid?{...f,done:true}:f),activities:[act('Follow-up completed'),...l.activities]}),'Follow-up completed');log('Follow-up completed',lead(lid).name);app()});
 $$('[data-reschedule]').forEach(b=>b.onclick=()=>{selected=b.dataset.reschedule;modal='followup';app()});
 $$('[data-auto]').forEach(b=>b.onclick=()=>{const a=state.automations.find(x=>x.id===b.dataset.auto);a.enabled=!a.enabled;state.interactions++;log(a.enabled?'Automation enabled':'Automation paused',a.title);save();app()});
 $('#back')?.addEventListener('click',()=>{selected=null;app()});$$('[data-modal]').forEach(b=>b.onclick=()=>{modal=b.dataset.modal;app()});
 $('#inlineAssignee')?.addEventListener('change',e=>{const l=lead(selected);l.assignee=e.target.value;l.activities.unshift(act('Lead assigned',l.assignee));state.interactions++;log('Lead assigned',`${l.name} → ${l.assignee}`);save();toastMsg('Assignment updated')});
 $('#inlinePriority')?.addEventListener('change',e=>{const l=lead(selected);l.priority=e.target.value;l.activities.unshift(act('Priority updated',l.priority));state.interactions++;save();toastMsg('Priority updated')});
 $('#saveNote')?.addEventListener('click',()=>{const v=$('#noteInput').value.trim();if(!v)return;const l=lead(selected);l.notes.push(v);l.activities.unshift(act('Note added',v));state.interactions++;save();toastMsg('Note saved')});
 $('#completeConsultation')?.addEventListener('click',()=>{mutate(selected,l=>{const active=l.consultations.find(c=>!c.completed);return {...l,stage:'Proposal',consultations:l.consultations.map(c=>c.id===active?.id?{...c,completed:true}:c),proposal:l.proposal||{status:'Draft',version:1,sent:null,next:null},activities:[act('Consultation completed','Moved to Proposal'),...l.activities]}} ,'Moved to Proposal');log('Pipeline moved','Consultation → Proposal');app()});
 $('#markWon')?.addEventListener('click',()=>{mutate(selected,l=>({...l,stage:'Won',followUps:l.followUps.map(f=>({...f,done:true})),consultations:l.consultations.map(c=>({...c,completed:true})),proposal:l.proposal?{...l.proposal,status:'Accepted'}:{status:'Accepted',version:1,sent:TODAY,next:null},activities:[act('Stage updated','Won'),...l.activities]}),'Lead marked won');log('Lead won',lead(selected).name);app()});
}
function bindModal(){
 $('#confirmReset')?.addEventListener('click',()=>{state=seed();localStorage.removeItem(KEYS.state);localStorage.removeItem(KEYS.guide);screen='overview';selected=null;modal=null;save();toastMsg('Trial data restored')});
 let outcome='Interested';$$('[data-choice]').forEach(b=>b.onclick=()=>{outcome=b.dataset.choice;$$('[data-choice]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
 $('#saveContact')?.addEventListener('click',()=>{const n=$('#contactNote')?.value.trim()||'';mutate(selected,l=>{if(stageRank[l.stage]>stageRank.Contacted)return l;const target=outcome==='Interested'?'Interested':'Contacted';const st=stageRank[target]>stageRank[l.stage]?target:l.stage;return {...l,stage:st,notes:n?[...l.notes,n]:l.notes,activities:[act('Contact marked',outcome),...(n?[act('Note added',n)]:[]),...l.activities]}} ,'Contact outcome saved');log('Contact outcome',`${lead(selected).name} · ${outcome}`);modal=null;app()});
 $$('[data-date]').forEach(b=>b.onclick=()=>{$('#fuDate').value=b.dataset.date});
 $('#saveFollowup')?.addEventListener('click',()=>{const date=$('#fuDate').value,time=$('#fuTime').value,n=$('#fuNote').value.trim();mutate(selected,l=>({...l,followUps:[...l.followUps.filter(f=>f.done),{id:uid('fu'),date,time,note:n,done:false}],notes:n?[...l.notes,n]:l.notes,activities:[act('Follow-up scheduled',`${dateLabel(date)} · ${timeLabel(time)}`),...l.activities]}),'Follow-up scheduled');log('Follow-up scheduled',`${lead(selected).name} · ${dateLabel(date)}`);modal=null;app()});
 $('#saveConsultation')?.addEventListener('click',()=>{const date=$('#cDate').value,time=$('#cTime').value,mode=$('#cMode').value,n=$('#cNote').value.trim();mutate(selected,l=>stageRank[l.stage]>=stageRank.Consultation?l:{...l,stage:'Consultation',consultations:[...l.consultations,{id:uid('con'),date,time,mode,note:n,completed:false}],notes:n?[...l.notes,n]:l.notes,activities:[act('Consultation booked',`${dateLabel(date)} · ${timeLabel(time)} · ${mode}`),...l.activities]},'Consultation booked');log('Consultation booked',lead(selected).name);modal=null;app()});
 $('#saveAssign')?.addEventListener('click',()=>{const l=lead(selected);l.assignee=$('#assignOwner').value;l.priority=$('#assignPriority').value;l.activities.unshift(act('Ownership updated',`${l.assignee} · ${l.priority} priority`));state.interactions++;log('Ownership updated',l.name);save();modal=null;toast='Assignment updated';app()});
 $('#copyWA')?.addEventListener('click',async()=>{const l=lead(selected),text=`Hi ${l.name}, this is the Neeva Homes team. Thanks for sharing your ${l.property} interior requirement. We’d love to understand your preferences and discuss the next step.`;try{await navigator.clipboard.writeText(text)}catch{}toast='Message copied';modal=null;app()});
 $('#saveAdd')?.addEventListener('click',()=>{const name=$('#aName').value.trim(),loc=$('#aLocation').value.trim();if(!name||!loc){toastMsg('Name and location are required');return}const l={id:uid('lead'),name,phone:$('#aPhone').value.trim(),property:$('#aProperty').value.trim()||'Interior project',area:$('#aArea').value.trim()||'Not specified',budget:$('#aBudget').value.trim()||'Not specified',location:loc,source:$('#aSource').value,stage:'New',priority:$('#aPriority').value,assignee:'Unassigned',received:'Just now',tags:[],notes:$('#aNotes').value.trim()?[$('#aNotes').value.trim()]:[],activities:[act('Lead added to workspace'),act('Enquiry received')],followUps:[],consultations:[],proposal:null};state.leads.unshift(l);state.interactions++;log('New enquiry added',l.name);save();selected=l.id;screen='leads';modal=null;toast='Enquiry added';app()});
 $('#copySetup')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText('proceed')}catch{}toast='Copied. Reply “proceed” in WhatsApp.';modal=null;app()});
}
function mutate(id,fn,msg){state.leads=state.leads.map(l=>l.id===id?fn(l):l);state.interactions++;save();if(msg)toast=msg}
function lead(id){return state.leads.find(l=>l.id===id)}
function log(title,detail){state.logs.unshift({time:nowLabel(),title,detail});save()}
function toastMsg(m){toast=m;app();setTimeout(()=>{toast='';app()},1900)}
function initials(n){return n.split(/[ &]/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
app();
</script>
</body>
</html>
