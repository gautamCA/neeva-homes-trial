name: Materialize standalone app

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize app bundle
        run: |
          curl --fail --location --silent --show-error \
            "https://ojas-interiors-trial.floot.app/_cdn/static/51c78dea-ee68-4cf5-a863-875fbd65dd8b-ojas-vercel-bundle.txt" \
            --output index.html
          test -s index.html
          grep -q "Ojas Interiors" index.html

      - name: Commit standalone app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Materialize standalone Ojas app [skip ci]"
          git push
