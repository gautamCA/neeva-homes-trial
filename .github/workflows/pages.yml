name: Deploy Ojas Trial to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        run: |
          mkdir -p public
          curl --fail --location --silent --show-error \
            "https://ojas-interiors-trial.floot.app/_cdn/static/51c78dea-ee68-4cf5-a863-875fbd65dd8b-ojas-vercel-bundle.txt" \
            --output public/index.html
          test -s public/index.html
          grep -q "Ojas Interiors" public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
