@media print{body>*{display:none!important}.print-area{display:block!important;background:white;color:#222;padding:28px;font-family:Arial,sans-serif}.print-area h1{font-size:29px}.print-area h2{font-size:15px;margin:22px 0 12px}.print-area p{font-size:11px;line-height:1.8}.print-area table{width:100%;border-collapse:collapse;margin:24px 0;font-size:11px}.print-area th,.print-area td{padding:12px 8px;border-bottom:1px solid #ddd;text-align:left}.print-area .sum{text-align:right;font-size:19px;font-weight:bold}.print-area .disclaimer{padding:13px;background:#f2f2ed;margin-top:22px;font-size:10px} @page{size:A4;margin:12mm}}

</head><body>
<a class="skip" href="#main">Skip to workspace</a><div id="app"></div><div id="layers"></div><div id="live" aria-live="polite" aria-atomic="true"></div><section id="print" class="print-area"></section>
<script>
'use strict';
const VERSION='1.0.0',STORE='siliconsoul-ayaan-studio-v1',GUIDE='siliconsoul-ayaan-guide-v1';
const STAGES=['New enquiry','Consultation','Design & quote','Quotation sent','Won','Closed'];
const PROJECTS=['Modular kitchen','Walk-in wardrobe','Full home interiors','Living & TV unit','Office fit-out','Retail & showroom','Hotel interiors','Custom furniture'];
const TEAM=['Sample designer 1','Sample designer 2','Sample studio lead','Unassigned'];
const MODES=['Discovery call','Site visit','Studio meeting'];
const ICONS={home:'<path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/>',inbox:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 13h5l2 3h4l2-3h5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/>',quote:'<path d="M6 3h9l4 4v14H6ZM14 3v5h5M9 12h7M9 16h5"/>',chart:'<path d="M4 3v18h17M8 16v-4M13 16V8M18 16V5"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 14a4 4 0 0 1 3 4v2"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',print:'<path d="M6 9V3h12v6M6 17H3V9h18v8h-3"/><rect x="6" y="14" width="12" height="7"/>',reset:'<path d="M3 10a9 9 0 1 1 1 8M3 4v6h6"/>',message:'<path d="M21 12a9 9 0 0 1-9 9 10 10 0 0 1-4-.8L3 21l.8-5A9 9 0 1 1 21 12Z"/><path d="M7 9h10M7 13h7"/>',edit:'<path d="m16 3 5 5-12 12-6 1 1-6L16 3ZM13 6l5 5"/>'};
function icon(n){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.inbox}</svg>`}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=s=>s.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function today(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Colombo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-')}
function plus(date,days){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s+'T12:00:00Z'))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s}
function dateLabel(s){if(!s)return 'Not scheduled';if(s===today())return 'Today';if(s===plus(today(),1))return 'Tomorrow';return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:s.slice(0,4)!==today().slice(0,4)?'numeric':undefined,timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'))}
function fullDate(s){return new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'))}
function money(v){return new Intl.NumberFormat('en-LK',{style:'currency',currency:'LKR',currencyDisplay:'code',maximumFractionDigits:2}).format(v)}
function compactMoney(v){return v>=1e6?'LKR '+(Math.round(v/10000)/100).toFixed(2)+'m':money(v)}
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'a-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
const stamp=()=>new Date().toISOString();
const terminal=r=>r.stage==='Won'||r.stage==='Closed';
function quoteTotal(q){if(!q)return {subtotal:0,discount:0,tax:0,total:0};const subtotal=Math.round(q.lines.reduce((s,l)=>s+Math.round(l.qty*l.rate*100),0))/100;const discount=Math.round(subtotal*q.discount)/100;const tax=Math.round((subtotal-discount)*q.tax)/100;return {subtotal,discount,tax,total:Math.round((subtotal-discount+tax)*100)/100}}
function quoteTemplate(project='Modular kitchen'){const templates={'Walk-in wardrobe':[{label:'Wardrobe cabinetry · per metre',qty:3,rate:160000},{label:'Hardware · allowance',qty:1,rate:60000},{label:'Installation · allowance',qty:1,rate:45000}],'Office fit-out':[{label:'Reception counter · allowance',qty:1,rate:180000},{label:'Workstation joinery · each',qty:6,rate:55000},{label:'Storage shelving · per metre',qty:4,rate:35000},{label:'Installation · allowance',qty:1,rate:60000}],'Living & TV unit':[{label:'Media cabinetry · per metre',qty:3.4,rate:125000},{label:'Wall finish · allowance',qty:1,rate:90000},{label:'Installation · allowance',qty:1,rate:45000}],'Full home interiors':[{label:'Design development · allowance',qty:1,rate:250000},{label:'Custom joinery · allowance',qty:1,rate:1100000},{label:'Installation · allowance',qty:1,rate:150000}],'Custom furniture':[{label:'Custom furniture · sample item',qty:1,rate:180000},{label:'Delivery & fitting · allowance',qty:1,rate:25000}],'Retail & showroom':[{label:'Display cabinetry · allowance',qty:1,rate:650000},{label:'Reception counter · allowance',qty:1,rate:180000},{label:'Installation · allowance',qty:1,rate:90000}],'Hotel interiors':[{label:'Room furniture package · sample room',qty:3,rate:450000},{label:'Installation · allowance',qty:1,rate:150000}]};return {lines:templates[project]||[{label:'Base cabinetry · per metre',qty:3.6,rate:125000},{label:'Wall cabinetry · per metre',qty:2.4,rate:85000},{label:'Worktop · per metre',qty:3.6,rate:40000},{label:'Installation · allowance',qty:1,rate:60000}],discount:0,tax:0,notes:'Indicative scope for discussion. Final dimensions, materials, taxes and exclusions must be confirmed after the site survey.',status:'Draft',revision:1,at:stamp()}}
function makeRecord(data){return {id:uid(),name:data.name,project:data.project,location:data.location,budget:data.budget,area:data.area,brief:data.brief,assignee:data.assignee,source:data.source,stage:'New enquiry',created:stamp(),consult:null,follow:null,quote:null,notes:[],log:[{text:'Enquiry added manually to the trial workspace',at:stamp()}]}}
function seed(){const t=today();const rows=[['Senanayake family','Modular kitchen','Homagama',1800000,'3.6 × 3.2 m','Warm timber finishes; wants a discovery call before arranging measurements.','New enquiry',null],['Fernando residence','Walk-in wardrobe','Colombo',1250000,'3.2 m wall','Discuss storage layout and preferred finishes.','Consultation',{date:t,time:'15:00',mode:'Site visit',note:'Measure bedroom wall and discuss storage.',done:false}],['Peris & Co.','Office fit-out','Nugegoda',4200000,'1,100 sq ft','Reception counter, meeting room and workstation storage.','Design & quote',null],['Wijesinghe family','Full home interiors','Kandy',6500000,'2,100 sq ft','Review phased scope before confirming the proposal.','Quotation sent',null],['De Silva apartment','Living & TV unit','Maharagama',950000,'3.4 m wall','Check preferred timber finish.','Quotation sent',null],['Jayawardena residence','Modular kitchen','Kottawa',1600000,'4.0 m run','Won example only. No real sale or payment.','Won',null],['Cedar House Café','Custom furniture','Colombo',2100000,'12 tables','Closed sample: project postponed.','Closed',null]];
return rows.map((a,i)=>{const r=makeRecord({name:a[0],project:a[1],location:a[2],budget:a[3],area:a[4],brief:a[5],assignee:TEAM[i%3],source:i%2?'Website (sample)':'WhatsApp (manual sample)'});r.id='sample-'+(i+1);r.stage=a[6];r.consult=a[7];r.created=new Date(Date.now()-i*86400000).toISOString();r.log=[{text:'Fictional enquiry prepared for this demonstration',at:r.created}];if(i===0)r.follow={date:t,time:'11:00',note:'Arrange discovery call'};if(i===3||i===4||i===5){r.quote=quoteTemplate();r.quote.lines=i===3?[{label:'Full home interior allowance',qty:1,rate:5850000}]:i===4?[{label:'Living & TV unit allowance',qty:1,rate:825000}]:[{label:'Kitchen cabinetry allowance',qty:1,rate:1450000}];r.quote.status='Shared manually';if(i!==5)r.follow={date:plus(t,i===3?-1:1),time:'10:00',note:'Review quotation and answer scope questions'};}return r})}
let storageOK=true,recovered=false;
function read(k){try{return localStorage.getItem(k)}catch{storageOK=false;return null}}
function write(k,v){try{localStorage.setItem(k,v);return true}catch{storageOK=false;return false}}
function validQuote(q){return q&&Array.isArray(q.lines)&&q.lines.length>0&&q.lines.length<=20&&q.lines.every(l=>l&&typeof l.label==='string'&&l.label.trim()&&l.label.length<=120&&Number.isFinite(l.qty)&&l.qty>0&&l.qty<=10000&&Number.isFinite(l.rate)&&l.rate>=0&&l.rate<=100000000)&&Number.isFinite(q.discount)&&q.discount>=0&&q.discount<=100&&Number.isFinite(q.tax)&&q.tax>=0&&q.tax<=100&&typeof q.notes==='string'&&q.notes.length<=2000&&['Draft','Shared manually'].includes(q.status)&&Number.isInteger(q.revision)&&q.revision>0&&q.revision<10000&&typeof q.at==='string'&&!isNaN(Date.parse(q.at))&&quoteTotal(q).total<=1000000000}
function validRecord(r){const txt=(v,n)=>typeof v==='string'&&v.length<=n;const time=v=>typeof v==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v);const ev=e=>e&&txt(e.text,2000)&&typeof e.at==='string'&&!isNaN(Date.parse(e.at));return !!(r&&txt(r.id,100)&&r.id&&txt(r.name,80)&&r.name.trim()&&PROJECTS.includes(r.project)&&txt(r.location,80)&&r.location.trim()&&Number.isFinite(r.budget)&&r.budget>=0&&r.budget<=1000000000&&txt(r.area,80)&&txt(r.brief,2000)&&TEAM.includes(r.assignee)&&txt(r.source,80)&&STAGES.includes(r.stage)&&typeof r.created==='string'&&!isNaN(Date.parse(r.created))&&(!r.consult||(validDate(r.consult.date)&&time(r.consult.time)&&MODES.includes(r.consult.mode)&&txt(r.consult.note,500)&&typeof r.consult.done==='boolean'))&&(!r.follow||(validDate(r.follow.date)&&time(r.follow.time)&&txt(r.follow.note,500)&&r.follow.note.trim()))&&(!r.quote||validQuote(r.quote))&&Array.isArray(r.notes)&&r.notes.length<=100&&r.notes.every(ev)&&Array.isArray(r.log)&&r.log.length<=250&&r.log.every(ev))}
function load(){const raw=read(STORE);if(!raw)return seed();try{const d=JSON.parse(raw);if(d.version!==VERSION||!Array.isArray(d.records)||d.records.length>250||!d.records.every(validRecord)||new Set(d.records.map(r=>r.id)).size!==d.records.length)throw Error('Invalid data');return d.records.map(r=>{if(terminal(r)){r.follow=null;if(r.consult&&!r.consult.done)r.consult.done=true}return r})}catch{recovered=true;return seed()}}
let records=load(),page='overview',view='list',search='',filter='All stages',drawerId=null,detailTab='overview',modal=null,menu=false,guideDismissed=read(GUIDE)==='1',focusBack=null,toastTimer,lastDay=today();
const record=id=>records.find(r=>r.id===id);
function save(){if(!records.every(validRecord))throw Error('Record validation failed');const ok=write(STORE,JSON.stringify({version:VERSION,records}));if(!ok)notify('Storage is unavailable. Changes remain in this session only.');return ok}
function log(r,text){r.log.unshift({text:String(text).slice(0,2000),at:stamp()});r.log=r.log.slice(0,250)}
function due(r){return !terminal(r)&&!!r.follow&&r.follow.date<=today()}
function upcomingConsult(r){return !terminal(r)&&r.consult&&!r.consult.done}
function nextAction(r){if(terminal(r))return r.stage==='Won'?'Won · history retained':'Closed · history retained';if(r.follow)return r.follow.note;if(upcomingConsult(r))return r.consult.mode+' · '+dateLabel(r.consult.date);if(r.stage==='New enquiry')return 'Arrange discovery call';if(r.stage==='Consultation')return 'Schedule consultation';if(r.stage==='Design & quote')return 'Prepare design proposal & quotation';if(r.stage==='Quotation sent')return 'Schedule quotation follow-up';return 'Choose next action'}
function stageClass(s){return ({'New enquiry':'new','Consultation':'consult','Design & quote':'design','Quotation sent':'sent','Won':'won','Closed':'closed'})[s]}
function pill(s){return `<span class="pill ${stageClass(s)}">${esc(s)}</span>`}
function btn(text,action,kind='',extra=''){return `<button class="btn ${kind}" data-action="${action}" ${extra}>${text}</button>`}
function openModal(m){focusBack=document.activeElement;modal=m;renderLayers();document.body.classList.add('no-scroll');requestAnimationFrame(()=>{const f=document.querySelector('.modal input:not([type=hidden]),.modal textarea,.modal select,.modal button');f?.focus()})}
function openRecord(id,tab='overview'){if(!record(id))return;focusBack=document.activeElement;drawerId=id;detailTab=tab;renderLayers();document.body.classList.add('no-scroll');requestAnimationFrame(()=>document.querySelector('.drawer [data-action="close-drawer"]')?.focus())}
function closeModal(){modal=null;renderLayers();if(!drawerId)document.body.classList.remove('no-scroll');if(focusBack?.isConnected)focusBack.focus({preventScroll:true});else document.querySelector(drawerId?'.drawer button':'[data-action=new]')?.focus({preventScroll:true})}
function closeDrawer(){drawerId=null;modal=null;document.body.classList.remove('no-scroll');renderLayers();if(focusBack?.isConnected)focusBack.focus({preventScroll:true});else document.querySelector(drawerId?'.drawer button':'[data-action=new]')?.focus({preventScroll:true})}
function notify(msg){clearTimeout(toastTimer);document.querySelector('#live').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;toastTimer=setTimeout(()=>document.querySelector('#live').replaceChildren(),3300)}
function stats(){const active=records.filter(r=>!terminal(r));return {active:active.length,due:active.filter(due).length,consult:active.filter(upcomingConsult).length,value:active.filter(r=>r.quote?.status==='Shared manually').reduce((s,r)=>s+quoteTotal(r.quote).total,0)}}
function render(){const scroll=document.querySelector('.drawer')?.scrollTop||0;const oldFocus=document.activeElement?.id;const s=stats();document.querySelector('#app').innerHTML=`<div class="layout">${menu?'<div class="backdrop" data-action="menu"></div>':''}<aside class="sidebar ${menu?'open':''}" aria-label="Workspace navigation"><a class="brand" href="#" data-page="overview"><span class="brandmark">A</span><span class="brandword"><strong>AYAAN</strong><small>ENQUIRY STUDIO</small></span></a><div class="workspace">Prepared for Ayaan Interiors</div><nav class="nav">${[['overview','home','Overview'],['enquiries','inbox','Enquiries'],['agenda','calendar','Agenda'],['quotations','quote','Quotations'],['insights','chart','Studio insights']].map(([p,i,t])=>`<button data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${icon(i)}${t}${p==='agenda'&&s.due?`<span class="count">${s.due}</span>`:''}</button>`).join('')}</nav><div class="sidebottom"><div class="side-note"><b>A clear next step.</b>From first enquiry to a considered proposal, with the personal touch intact.</div>${btn(icon('info')+'About this trial','about','compact')}<div class="credit">CONCEPT PREPARED BY<b>SILICON SOUL</b></div></div></aside><div class="content"><header class="topbar"><div class="flex"><button class="iconbtn mobile-menu" data-action="menu" aria-label="Toggle navigation">${icon('menu')}</button><div class="crumb"><span>Studio workspace</span><span>/</span><b>${({overview:'Overview',enquiries:'Enquiries',agenda:'Agenda',quotations:'Quotations',insights:'Studio insights'})[page]}</b></div></div><div class="flex"><span class="topdate">${esc(fullDate(today()))} · Sri Lanka</span><span class="tag">Concept trial · Sample data</span><span class="avatar" title="Sample workspace">AS</span></div></header><div class="disclosure-bar">${icon('info')}Fictional projects & sample prices. Saved in this browser. WhatsApp is manual; no messages are sent.</div><main class="main" id="main" tabindex="-1">${!storageOK?'<div class="notice">Browser storage is unavailable. This session works, but changes may be lost when you close it.</div>':''}${recovered?'<div class="notice">Saved trial data could not be read. Sample projects are shown. Use “Reset sample data” to replace the unreadable trial data.</div>':''}${pageView()}<footer class="footer"><span>Prepared for Ayaan Interiors · Concept ${VERSION} · All names and amounts are fictional</span><a href="https://siliconsoul.continuumarc.tech" target="_blank" rel="noopener noreferrer">Built by Silicon Soul ↗</a></footer></main></div></div>`;renderLayers();if(drawerId){const d=document.querySelector('.drawer');if(d)d.scrollTop=scroll;if(oldFocus)document.getElementById(oldFocus)?.focus({preventScroll:true})}}
function head(k,title,sub,action='new'){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${sub}</p></div>${btn(icon('plus')+(action==='new'?'New enquiry':'Explore sample flow'),action,'primary')}</div>`}
function metric(label,value,note,i,action='enquiries',warn=false){return `<button class="metric ${warn?'warn':''}" data-action="metric" data-target="${action}"><span class="flex"><span>${label}</span>${icon(i)}</span><strong>${value}</strong><small>${note}</small></button>`}
function metrics(){const s=stats();return `<div class="metrics">${metric('Active enquiries',s.active,'Open sample projects','inbox')}${metric('Follow-ups due',s.due,'Today & overdue · Sri Lanka','clock','agenda',true)}${metric('Consultations',s.consult,'Scheduled & incomplete','calendar','agenda')}${metric('Open quotation value',compactMoney(s.value),'Shared sample quotes · not revenue','quote','quotations')}</div>`}
function projectTable(rows,compact=false){if(!rows.length)return `<div class="empty">${icon('inbox')}No enquiries match this view.<br>Try a different search or add an enquiry.</div>`;return `<table class="table"><thead><tr><th>Client / location</th><th>Project</th><th>Stage</th><th class="optional">Designer</th><th>Next step</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="client"><span class="client-avatar">${esc(initials(r.name))}</span><div><b>${esc(r.name)}</b><small>${esc(r.location)}</small></div></div></td><td>${esc(r.project)}<span class="subline">${r.budget?compactMoney(r.budget)+' budget':'Budget to discuss'}</span></td><td>${pill(r.stage)}</td><td class="optional"><span class="subline">${esc(r.assignee)}</span></td><td><div class="task ${due(r)?'attention':''}">${esc(nextAction(r))}</div><span class="subline">${r.follow&&!terminal(r)?esc(dateLabel(r.follow.date))+' · '+r.follow.time:''}</span></td><td><button class="rowbtn" data-action="open" data-id="${esc(r.id)}" aria-label="Open ${esc(r.name)}">Open ${icon('chevron')}</button></td></tr>`).join('')}</tbody></table><div class="mobilecards">${rows.map(r=>`<article class="mobilecard"><div class="flex"><div class="client"><span class="client-avatar">${esc(initials(r.name))}</span><div><b>${esc(r.name)}</b><small>${esc(r.project)} · ${esc(r.location)}</small></div></div></div><div class="mobilecard-bottom">${pill(r.stage)}<button class="rowbtn" data-action="open" data-id="${esc(r.id)}" aria-label="Open ${esc(r.name)}">Open ${icon('chevron')}</button></div><div class="task ${due(r)?'attention':''}" style="margin-top:10px">${esc(nextAction(r))}${r.follow&&!terminal(r)?' · '+esc(dateLabel(r.follow.date)):''}</div></article>`).join('')}</div>`}
function pageView(){if(page==='overview')return overview();if(page==='enquiries')return enquiries();if(page==='agenda')return agenda();if(page==='quotations')return quotations();return insights()}
function overview(){const rows=records.filter(r=>!terminal(r)).slice(0,5);return `${head('The studio, at a glance','Good design starts with a conversation.','Keep every enquiry moving, from the first brief to the next follow-up.')}<section class="hero"><div class="hero-copy"><div class="eyebrow">A considered workflow</div><h2>Every enquiry.<br>A clear next step.</h2><p>One place for the brief, consultation, quotation and follow-up. Your team keeps the conversation personal.</p>${btn('Explore sample flow '+icon('arrow'),'inbox')}</div><div class="room" aria-hidden="true"><svg viewBox="0 0 430 240" fill="none"><path d="M20 204 189 118 407 175 234 231Z" fill="#3b4436"/><path d="m189 118 218 57V51L189 0Z" fill="#343e32"/><path d="M189 118 20 204V80L189 0Z" fill="#2e372c"/><g stroke="#a7ac85" stroke-width="1"><path d="m46 164 95-49 105 27v39l-95-25-105 48Z"/><path d="m46 164 106 29 94-51M152 193v37M46 164v40M89 177v29M198 155v38M189 118V0"/><path d="m246 142 115-59v58l-115 59ZM270 130v57M312 108v57M335 96v57M246 142v58"/><path d="m227 62 117 31V51L227 20ZM267 31v42M306 42v42"/><path d="m54 73 84-43v66l-84 43ZM95 52v66M54 106l84-43"/><path d="M96 159v-19q0-11 9-11t9 11M94 159l28 7 19-10-28-7Z"/><path d="M270 7v34m-17 4q17-22 34 9Z"/><path d="m41 219 84-43M270 222l105-52" stroke-dasharray="3 5" opacity=".6"/></g></svg><span class="room-tag">From brief to proposal</span></div></section>${!guideDismissed?`<div class="guide"><div><div class="eyebrow">Try the complete journey</div><p>Start with a fictional WhatsApp enquiry, then schedule a visit and prepare a quotation.</p></div><div class="flex">${btn('Start example '+icon('arrow'),'inbox','compact')}<button class="iconbtn" data-action="dismiss-guide" aria-label="Dismiss trial guide">${icon('close')}</button></div></div>`:''}${metrics()}<div class="sectionhead"><div><h2>Projects in conversation</h2><p>Sample enquiries with the next action visible.</p></div><button class="btn compact" data-page="enquiries">View all ${icon('arrow')}</button></div><section class="panel">${projectTable(rows)}<div class="panel-foot"><span>${rows.length} of ${records.filter(r=>!terminal(r)).length} active sample enquiries</span><span>All records are fictional</span></div></section><div class="bottom-grid"><section class="mini-panel"><div class="eyebrow">Next conversations</div>${records.filter(r=>due(r)||upcomingConsult(r)).slice(0,3).map(r=>`<div class="taskline"><div><b>${esc(r.name)}</b><p>${esc(nextAction(r))}</p></div><button class="rowbtn" data-action="open" data-id="${esc(r.id)}">View</button></div>`).join('')||'<p class="small muted">No actions currently due.</p>'}</section><section class="mini-panel"><div class="eyebrow">Designed around your process</div><h3>Discovery → site visit → proposal.</h3><p class="small muted" style="line-height:1.9;margin-top:12px">A working concept based on Ayaan’s published service journey. The live setup would be agreed around your actual team and process.</p>${btn('What works in this trial '+icon('arrow'),'about','compact','style="margin-top:15px"')}</section></div>`}
function filtered(){const q=search.toLocaleLowerCase();return records.filter(r=>(filter==='All stages'||r.stage===filter)&&[r.name,r.project,r.location,r.assignee].some(s=>s.toLocaleLowerCase().includes(q)))}
function enquiries(){const rows=filtered();return `${head('The enquiry workspace','From first hello to a finished proposal.','Search, assign and move each sample enquiry forward.')}<div class="panel" style="margin-bottom:18px"><div class="toolbar"><div class="searchbox">${icon('search')}<input class="input" id="search" type="search" placeholder="Search client, project or location" value="${esc(search)}" aria-label="Search enquiries"></div><select class="input" id="stage-filter" aria-label="Filter enquiries by stage">${['All stages',...STAGES].map(s=>`<option ${filter===s?'selected':''}>${esc(s)}</option>`).join('')}</select><div class="seg" aria-label="Enquiry view"><button data-action="view" data-view="list" class="${view==='list'?'active':''}" aria-pressed="${view==='list'}">List</button><button data-action="view" data-view="board" class="${view==='board'?'active':''}" aria-pressed="${view==='board'}">Board</button></div>${btn(icon('download')+'CSV','export','compact')}</div>${view==='list'?`<div id="results">${projectTable(rows)}</div>`:''}<div class="panel-foot"><span id="result-count">${rows.length} ${rows.length===1?'enquiry':'enquiries'}</span><span>Stage changes are saved in this browser</span></div></div>${view==='board'?`<div class="board" id="results">${board(rows)}</div>`:''}`}
function board(rows){return STAGES.map(s=>{const list=rows.filter(r=>r.stage===s);return `<section class="column"><div class="column-head"><span>${esc(s)}</span><small>${list.length}</small></div>${list.map(r=>`<button class="leadcard" data-action="open" data-id="${esc(r.id)}"><h3>${esc(r.name)}</h3><p>${esc(r.project)}<br>${esc(r.location)}</p><div class="leadcard-foot">${esc(nextAction(r))}</div></button>`).join('')||'<p class="small muted" style="padding:10px 0">No enquiries</p>'}</section>`}).join('')}
function agenda(){let tasks=[];records.filter(r=>!terminal(r)).forEach(r=>{if(r.follow)tasks.push({r,type:'Follow-up',...r.follow});if(upcomingConsult(r))tasks.push({r,type:r.consult.mode,...r.consult})});tasks.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const groups=[['Overdue',tasks.filter(x=>x.date<today())],['Today',tasks.filter(x=>x.date===today())],['Upcoming',tasks.filter(x=>x.date>today())]];return `${head('The next action','A place for every next conversation.','Consultations and follow-ups, shown in Sri Lanka time.')}<div class="note-box" style="margin:0 0 20px">This agenda is a working browser-local schedule. It does not send notifications or create calendar invitations.</div>${tasks.length?groups.filter(x=>x[1].length).map(([name,list])=>`<section class="agenda-group"><h3>${name} · ${list.length}</h3>${list.map(x=>`<article class="agenda-card"><div class="day-square">${x.date===today()?'Today':x.date.slice(8)}</div><div class="body"><h3>${esc(x.r.name)}</h3><p>${esc(x.type)} · ${esc(dateLabel(x.date))}, ${x.time}<br>${esc(x.note)}</p></div>${btn('Open enquiry '+icon('arrow'),'open','compact',`data-id="${esc(x.r.id)}"`)}</article>`).join('')}</section>`).join(''):'<div class="panel empty">No consultations or follow-ups are scheduled.</div>'}`}
function quotations(){const qs=records.filter(r=>r.quote);return `${head('A proposal with context','Clear scope. A considered quotation.','Sample LKR prices for demonstration, with editable line items.')}<div class="note-box" style="margin:0 0 20px">Quotation values are illustrative. “Shared manually” records an action only; the trial does not send a quotation or collect payment.</div><section class="panel">${qs.length?`<table class="table"><thead><tr><th>Client / project</th><th>Quotation</th><th>Status</th><th>Amount</th><th></th></tr></thead><tbody>${qs.map(r=>`<tr><td><div class="client"><span class="client-avatar">${esc(initials(r.name))}</span><div><b>${esc(r.name)}</b><small>${esc(r.project)}</small></div></div></td><td>AY-${esc(r.id.slice(-6).toUpperCase())}<span class="subline">Revision ${r.quote.revision}</span></td><td><span class="pill ${r.quote.status==='Draft'?'design':'sent'}">${r.quote.status}</span></td><td>${money(quoteTotal(r.quote).total)}</td><td><button class="rowbtn" data-action="open-quote" data-id="${esc(r.id)}">Review ${icon('chevron')}</button></td></tr>`).join('')}</tbody></table><div class="mobilecards">${qs.map(r=>`<article class="mobilecard"><h3>${esc(r.name)}</h3><p class="small muted" style="margin:8px 0">${r.quote.status} · ${money(quoteTotal(r.quote).total)}</p>${btn('Review quotation','open-quote','compact',`data-id="${esc(r.id)}"`)}</article>`).join('')}</div>`:'<div class="empty">No quotations yet. Open an enquiry to create one.</div>'}</section>`}
function insights(){const s=stats(),quotes=records.filter(r=>r.quote),won=records.filter(r=>r.stage==='Won');return `${head('Visibility for the studio','See what needs attention.','Counts and values calculated from the sample enquiries in this browser.')} ${metrics()}<div class="reportgrid"><section class="reportpanel"><h2>Enquiries by stage</h2><p class="hint">${records.length} fictional enquiries · counts update as you work.</p>${STAGES.map(x=>{let n=records.filter(r=>r.stage===x).length;return `<div class="barrow"><div class="flex"><span>${esc(x)}</span><b>${n}</b></div><div class="bar"><span style="width:${records.length?n/records.length*100:0}%"></span></div></div>`}).join('')}</section><section class="reportpanel"><h2>What needs a next step?</h2>${[['Follow-ups due',s.due,'Today and overdue'],['Awaiting consultation',s.consult,'Incomplete scheduled consultations'],['Shared quotes without follow-up',records.filter(r=>!terminal(r)&&r.quote?.status==='Shared manually'&&!r.follow).length,'A useful next conversation to schedule'],['Unassigned enquiries',records.filter(r=>!terminal(r)&&r.assignee==='Unassigned').length,'Choose a sample designer']].map(([label,n,note])=>`<div class="taskline"><div><b>${label}</b><p>${note}</p></div><strong style="font-size:24px;font-weight:500">${n}</strong></div>`).join('')}<div class="note-box">${quotes.length} sample quotations · ${won.length} sample ${won.length===1?'project':'projects'} marked won.<br>These are demonstration records, not actual sales, revenue or conversion results.</div></section></div>`}
function drawerView(r){return `<div class="overlay" data-action="overlay-close"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-head"><span class="eyebrow">Enquiry detail · Fictional project</span><button class="iconbtn" data-action="close-drawer" aria-label="Close enquiry">${icon('close')}</button></div><div class="flex between"><span class="client-avatar" style="width:43px;height:45px;font-size:13px">${esc(initials(r.name))}</span>${pill(r.stage)}</div><h2 class="drawer-title" id="drawer-title">${esc(r.name)}</h2><p class="drawer-sub">${esc(r.project)} · ${esc(r.location)}<br>${esc(r.source)} · ${esc(r.assignee)}</p><nav class="detailtabs" aria-label="Enquiry detail sections">${[['overview','Overview'],['quotation','Quotation'],['activity','Activity']].map(([k,t])=>`<button data-action="detail-tab" data-tab="${k}" class="${detailTab===k?'active':''}" aria-pressed="${detailTab===k}">${t}</button>`).join('')}</nav>${detailTab==='overview'?detailOverview(r):detailTab==='quotation'?quoteView(r):activityView(r)}</section></div>`}
function detailOverview(r){return `<div class="detailbox"><div class="details-grid"><div><small>Project budget · sample</small><p>${r.budget?money(r.budget):'To discuss'}</p></div><div><small>Area / dimensions</small><p>${esc(r.area||'To confirm')}</p></div><div class="full"><small>Client brief</small><p>${esc(r.brief||'No brief added.')}</p></div></div></div><div class="detailbox"><h3>Responsibility & stage</h3><div class="formgrid"><label class="field">Sample designer<select class="input" id="assignee" data-record="${esc(r.id)}">${TEAM.map(x=>`<option ${x===r.assignee?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field">Project stage<select class="input" id="stage" data-record="${esc(r.id)}">${STAGES.map(x=>`<option ${x===r.stage?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div><p class="hint">Sample team labels. No user accounts or live team notifications are connected.</p></div><div class="detailbox"><h3>${terminal(r)?'Completed workflow':'Next action'}</h3><p class="small" style="line-height:1.8">${esc(nextAction(r))}</p>${r.follow&&!terminal(r)?`<p class="hint">${esc(fullDate(r.follow.date))} · ${r.follow.time} · Sri Lanka</p><div class="actions">${btn(icon('check')+'Complete follow-up','complete-follow','compact',`data-id="${esc(r.id)}"`)}</div>`:''}${!terminal(r)?`<div class="actions">${btn(icon('calendar')+'Schedule consultation','consult','compact',`data-id="${esc(r.id)}"`)}${btn(icon('clock')+'Set follow-up','follow','compact',`data-id="${esc(r.id)}"`)}</div>`:'<p class="hint">Open reminders have been cleared. The complete history is retained in Activity.</p>'}</div>${upcomingConsult(r)?`<div class="detailbox"><h3>${esc(r.consult.mode)}</h3><p class="small">${esc(fullDate(r.consult.date))} · ${r.consult.time}</p><p class="hint">${esc(r.consult.note)}</p><div class="actions">${btn(icon('check')+'Complete consultation','complete-consult','soft compact',`data-id="${esc(r.id)}"`)}</div></div>`:''}<div class="actions">${btn(icon('quote')+(r.quote?'Review quotation':'Prepare quotation'),'detail-quote','primary',`data-id="${esc(r.id)}"`)}${btn(icon('message')+'Prepare reply','reply','',`data-id="${esc(r.id)}"`)}</div><div class="detailbox"><h3>Project notes</h3>${r.notes.slice(0,4).map(n=>`<div class="note">${esc(n.text)}</div>`).join('')}<form id="note-form" data-record="${esc(r.id)}"><label class="field" for="new-note">Add a note<textarea class="input" id="new-note" name="text" maxlength="2000" required placeholder="Materials, preferences or a useful detail…"></textarea></label><div class="actions">${btn('Save note','submit-note','compact','type="submit"')}</div></form></div>`}
function quoteLine(l,i){return `<div class="quote-row" data-line="${i}"><input class="input" name="label" aria-label="Item ${i+1} description" value="${esc(l.label)}" maxlength="120" required><input class="input" name="qty" aria-label="Item ${i+1} quantity" type="number" min="0.01" max="10000" step="0.01" value="${l.qty}" required><input class="input" name="rate" aria-label="Item ${i+1} rate in LKR" type="number" min="0" max="100000000" step="0.01" value="${l.rate}" required><button class="iconbtn" type="button" data-action="remove-line" aria-label="Remove item ${i+1}">${icon('close')}</button></div>`}
function quoteView(r){const q=r.quote||quoteTemplate(r.project);const t=quoteTotal(q);return `<div class="note-box" style="margin-top:0">Sample pricing in LKR. These are not Ayaan’s actual rates. Confirm quantities, taxes, materials and exclusions before using a live quotation.</div><form id="quote-form" data-record="${esc(r.id)}"><div class="detailbox"><div class="flex between" style="margin-bottom:16px"><h3 style="margin:0">Indicative quotation</h3><span class="pill ${q.status==='Draft'?'design':'sent'}">${q.status} · r${q.revision}</span></div><div class="quote-row quote-head"><span>Description</span><span>Qty</span><span>Rate · LKR</span><span></span></div><div id="quote-lines">${q.lines.map(quoteLine).join('')}</div>${btn(icon('plus')+'Add line item','add-line','compact','type="button"')}<div class="formgrid" style="margin-top:18px"><label class="field">Discount %<input class="input" id="discount" name="discount" type="number" min="0" max="100" step="0.01" value="${q.discount}" required></label><label class="field">Tax % · illustrative<input class="input" id="tax" name="tax" type="number" min="0" max="100" step="0.01" value="${q.tax}" required></label></div><div class="quote-totals" id="quote-totals">${totalsHTML(t,q)}</div></div><div class="detailbox"><label class="field">Scope notes & exclusions<textarea class="input" name="notes" id="quote-notes" maxlength="2000">${esc(q.notes)}</textarea></label><p class="hint">Saving moves an open enquiry to Design & quote and archives an active consultation. Editing a shared quotation creates a new draft revision. No message is sent.</p></div><div id="quote-error"></div><div class="actions">${btn(icon('check')+'Save quotation','submit-quote','primary','type="submit"')}${r.quote?btn(icon('print')+'Print saved / PDF','print','','type="button" data-id="'+esc(r.id)+'"'):''}</div></form>${r.quote?`<div class="detailbox"><h3>Share it personally</h3><p class="hint">Review the saved quotation, then copy a reply or record that you shared it. Both steps are manual.</p><div class="actions">${btn(icon('message')+'Prepare reply','reply','compact',`data-id="${esc(r.id)}"`)}${r.quote.status==='Draft'&&!terminal(r)?btn('Mark shared manually','share-quote','soft compact',`data-id="${esc(r.id)}"`):''}${!terminal(r)?btn('Set follow-up','follow','compact',`data-id="${esc(r.id)}"`):''}</div></div>`:''}`}
function totalsHTML(t,q){return `<span>Subtotal</span><span>${money(t.subtotal)}</span><span>Discount (${q.discount}%)</span><span>− ${money(t.discount)}</span><span>Tax (${q.tax}%)</span><span>${money(t.tax)}</span><span class="total-label">Illustrative total</span><strong id="quote-total">${money(t.total)}</strong>`}
function activityView(r){return `<div class="detailbox"><h3>Complete project history</h3>${r.log.map(e=>`<div class="logrow">${esc(e.text)}<small>${esc(new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Colombo'}).format(new Date(e.at)))} · Sri Lanka</small></div>`).join('')}</div>${r.consult?`<div class="detailbox"><h3>Consultation record</h3><p class="small">${esc(r.consult.mode)} · ${esc(fullDate(r.consult.date))} · ${r.consult.time}</p><p class="hint">${r.consult.done?'Completed / archived':'Scheduled'} · ${esc(r.consult.note)}</p></div>`:''}`}
function modalShell(title,body,wide=false){return `<div class="modalwrap" data-action="modal-overlay-close"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="iconbtn" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${body}</section></div>`}
function modalView(){if(!modal)return '';if(modal.type==='inbox')return modalShell('It starts with a conversation.',`<p>A fictional WhatsApp enquiry, ready to organise. This illustration is not connected to WhatsApp.</p><div class="chat-sample"><div class="chat-head"><b>Perera family · sample enquiry</b><span>Illustrative conversation</span></div><div class="bubble">Hello! We’re planning a modular kitchen for our home in Homagama. The room is about 3.6 × 3.2 m, and our budget is around LKR 1.8 million. We like warm timber finishes. Could we arrange a call and a site visit?<small>Fictional message · no live chat</small></div></div><div class="journey"><span>Client message</span>${icon('arrow')}<span>Manual entry</span>${icon('arrow')}<span>Next action</span></div><p class="hint">Select “Use this enquiry” to review and add the sample details yourself. No message is imported automatically.</p><div class="actions">${btn('Use this enquiry '+icon('arrow'),'sample-create','primary')}${btn('Back to workspace','close-modal')}</div>`);
if(modal.type==='new'){const d=modal.sample?{name:'Perera family',project:'Modular kitchen',location:'Homagama',budget:1800000,area:'3.6 × 3.2 m',brief:'Planning a modular kitchen with warm timber finishes. Requests a discovery call and site visit. Budget and dimensions to be confirmed.'}:{name:'',project:PROJECTS[0],location:'',budget:'',area:'',brief:''};return modalShell('A new conversation.',`<p>${modal.sample?'Review the details from the fictional WhatsApp enquiry. Adding this record is a manual action.':'Add a sample enquiry manually. Please use fictional details only.'}</p><form id="new-form"><div class="formgrid"><label class="field">Client name<input class="input" name="name" id="client-name" maxlength="80" value="${esc(d.name)}" required autocomplete="off"></label><label class="field">Project type<select class="input" name="project" id="project-type">${PROJECTS.map(x=>`<option ${x===d.project?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Location<input class="input" name="location" id="location" maxlength="80" value="${esc(d.location)}" required autocomplete="off"></label><label class="field">Sample budget · LKR<input class="input" name="budget" id="budget" type="number" min="0" max="1000000000" step="1" value="${d.budget}" placeholder="Optional"></label><label class="field">Area / dimensions<input class="input" name="area" id="area" maxlength="80" value="${esc(d.area)}" placeholder="Optional"></label><label class="field">Sample designer<select class="input" name="assignee" id="new-assignee">${TEAM.map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field full">Client brief<textarea class="input" name="brief" id="brief" maxlength="2000" required>${esc(d.brief)}</textarea></label></div><p class="hint">${modal.sample?'Source: WhatsApp (manual sample).':'Source: Manual entry (sample).'} No real client data is needed.</p><div id="new-error"></div><div class="actions">${btn('Add to workspace '+icon('arrow'),'submit-new','primary','type="submit"')}${btn('Cancel','close-modal','','type="button"')}</div></form>`)}
if(modal.type==='consult'||modal.type==='follow'){const r=record(modal.id);if(!r)return '';const isC=modal.type==='consult',v=(isC?r.consult:r.follow)||{};return modalShell(isC?'Plan the consultation.':'Give it a next step.',`<p>${esc(r.name)} · ${esc(r.project)}<br>${isC?'Schedule a sample discovery call, site visit or studio meeting.':'Keep the next conversation visible in your agenda.'}</p><form id="schedule-form" data-kind="${modal.type}" data-record="${esc(r.id)}"><div class="formgrid">${isC?`<label class="field full">Consultation type<select class="input" name="mode" id="consult-mode">${MODES.map(x=>`<option ${x===v.mode?'selected':''}>${x}</option>`).join('')}</select></label>`:''}<label class="field">Date · Sri Lanka<input class="input" type="date" name="date" id="schedule-date" min="${today()}" value="${v.date&&v.date>=today()?v.date:plus(today(),1)}" required></label><label class="field">Time · Sri Lanka<input class="input" type="time" name="time" id="schedule-time" value="${v.time||'10:00'}" required></label><div class="full flex wrap">${btn('Tomorrow','quick-date','compact','type="button" data-days="1"')}${btn('In 2 days','quick-date','compact','type="button" data-days="2"')}${btn('Next week','quick-date','compact','type="button" data-days="7"')}</div><label class="field full">${isC?'Meeting notes':'Next action'}<textarea class="input" name="note" id="schedule-note" maxlength="500" required>${esc(v.note||(isC?'Discuss scope, finishes and next steps.':'Review the quotation and answer any scope questions.'))}</textarea></label></div><p class="hint">Saved in this trial only. No calendar invitation, notification or WhatsApp message is sent.</p><div id="schedule-error"></div><div class="actions">${btn(isC?'Save consultation':'Save follow-up','submit-schedule','primary','type="submit"')}${btn('Cancel','close-modal','','type="button"')}</div></form>`)}
if(modal.type==='reply'){const r=record(modal.id);return modalShell('A personal reply, ready to review.',`<p>Edit the draft, copy it, then paste it into WhatsApp yourself. The trial never sends a message.</p><label class="field" for="reply-text">Suggested reply</label><textarea class="replypreview" id="reply-text" maxlength="4000">${esc(reply(r))}</textarea><p class="hint">All details and prices are illustrative. Review before sharing.</p><div class="actions">${btn(icon('copy')+'Copy reply','copy-reply','primary')}${btn('Done','close-modal')}</div>`)}
if(modal.type==='terminal'){const r=record(modal.id);return modalShell(modal.stage==='Won'?'Mark this sample project won?':'Close this sample enquiry?',`<p>${esc(r.name)} will move to <b>${esc(modal.stage)}</b>. Open follow-ups and consultations will leave the agenda. Notes, consultation details and quotation history stay available.</p><div class="note-box">This changes a fictional trial record only. It does not create a sale, contract, booking or payment.</div><div class="actions">${btn('Confirm sample status','confirm-terminal','primary')}${btn('Cancel','close-modal')}</div>`)}
if(modal.type==='reset')return modalShell('Start fresh with the sample projects?',`<p>This replaces the trial records saved in this browser and restores the walkthrough prompt. It affects only this Ayaan concept trial.</p><div class="actions">${btn('Reset sample data','confirm-reset','primary')}${btn('Keep exploring','close-modal')}</div>`);
return modalShell('A working concept. A clear scope.',`<p>Prepared independently for Ayaan Interiors by Silicon Soul, based on the service journey described on Ayaan’s public website.</p><div class="detailbox"><h3>Working in this trial</h3><p class="small muted" style="line-height:2">Manual enquiry entry · sample team assignment · consultation scheduling · editable LKR quotations · discount and tax arithmetic · print / save PDF · follow-up agenda · editable reply drafts · CSV export · activity history · browser-local persistence.</p></div><div class="detailbox"><h3>For an agreed live implementation</h3><p class="small muted" style="line-height:2">Team authentication, a shared database, real document storage, notification delivery and any WhatsApp Business API integration would require separate implementation and configuration.</p></div><p class="hint">All names, projects, staff labels and prices are fictional. This is a demonstration, not Ayaan’s live operations system. Do not enter confidential client information. Data stays in this browser and is not shared across devices.</p><div class="actions">${btn('Explore sample enquiry','inbox','primary')}${btn(icon('reset')+'Reset sample data','reset','danger')}</div>`)}
function renderLayers(){const existing=!!document.querySelector('.overlay');document.querySelector('#layers').innerHTML=(drawerId&&record(drawerId)?drawerView(record(drawerId)):'')+modalView();if(existing){document.querySelector('.overlay')?.classList.add('no-enter')}}
function reply(r){if(!r)return '';const lines=[`Hello ${r.name},`,`Thank you for discussing your ${r.project.toLowerCase()} project in ${r.location} with us.`];if(r.quote)lines.push(`We have prepared an indicative quotation of ${money(quoteTotal(r.quote).total)} for the scope discussed. We can go through the materials, dimensions and any adjustments together.`);if(upcomingConsult(r))lines.push(`Your ${r.consult.mode.toLowerCase()} is noted for ${fullDate(r.consult.date)} at ${r.consult.time} (Sri Lanka time). Please let us know if that suits you.`);if(r.follow)lines.push(`We have noted ${dateLabel(r.follow.date).toLowerCase()} for our next follow-up.`);lines.push('Please share any questions or preferences you would like us to consider.','Ayaan Interiors','[Concept trial: fictional project and sample pricing.]');return lines.join('\n\n')}
function currentQuote(){const f=document.querySelector('#quote-form');if(!f)return null;const r=record(f.dataset.record),previous=r.quote;const q={lines:[...f.querySelectorAll('[data-line]')].map(e=>({label:e.querySelector('[name=label]').value.trim(),qty:Number(e.querySelector('[name=qty]').value),rate:Number(e.querySelector('[name=rate]').value)})),discount:Number(f.discount.value),tax:Number(f.tax.value),notes:f.notes.value.trim(),status:'Draft',revision:previous?previous.revision+(previous.status==='Shared manually'?1:0):1,at:stamp()};return q}
function renumberLines(){document.querySelectorAll('#quote-lines [data-line]').forEach((row,i)=>{row.dataset.line=i;for(const [key,label] of [['label','description'],['qty','quantity'],['rate','rate in LKR']])row.querySelector('[name='+key+']').setAttribute('aria-label','Item '+(i+1)+' '+label);row.querySelector('button').setAttribute('aria-label','Remove item '+(i+1))})}
function updateTotals(){const q=currentQuote();if(!q)return;const total=quoteTotal(q);document.querySelector('#quote-totals').innerHTML=Number.isFinite(total.total)?totalsHTML(total,q):'<span>Please check the amounts.</span>'}
function printQuote(r){if(!r?.quote)return;const q=r.quote,t=quoteTotal(q);document.querySelector('#print').innerHTML=`<p style="letter-spacing:2px;font-size:10px">AYAAN INTERIORS · CONCEPT TRIAL</p><h1>Indicative quotation</h1><p>Fictional client: <b>${esc(r.name)}</b><br>${esc(r.project)} · ${esc(r.location)}<br>Reference: AY-${esc(r.id.slice(-6).toUpperCase())} · Revision ${q.revision}<br>Prepared: ${esc(fullDate(today()))} · Currency: LKR</p><table><thead><tr><th>Scope / item</th><th>Quantity</th><th>Rate (LKR)</th><th>Amount (LKR)</th></tr></thead><tbody>${q.lines.map(l=>`<tr><td>${esc(l.label)}</td><td>${l.qty}</td><td>${money(l.rate)}</td><td>${money(Math.round(l.qty*l.rate*100)/100)}</td></tr>`).join('')}</tbody></table><p style="text-align:right">Subtotal: ${money(t.subtotal)}<br>Discount (${q.discount}%): − ${money(t.discount)}<br>Tax (${q.tax}%): ${money(t.tax)}</p><p class="sum">Illustrative total: ${money(t.total)}</p><h2>Scope notes & exclusions</h2><p style="white-space:pre-wrap">${esc(q.notes)}</p><p class="disclaimer">DEMONSTRATION ONLY. All names, quantities and rates are fictional. This is not an actual offer or Ayaan’s pricing. Final scope, dimensions, materials, taxes, payment terms and exclusions must be agreed before any live quotation. Prepared by Silicon Soul for evaluation.</p>`;window.print()}
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const headings=['Client (fictional)','Project','Location','Budget LKR (sample)','Stage','Sample designer','Quotation status','Quotation LKR (sample)','Next action','Follow-up date','Follow-up time'];const rows=records.map(r=>[r.name,r.project,r.location,r.budget,r.stage,r.assignee,r.quote?.status||'',r.quote?quoteTotal(r.quote).total:'',nextAction(r),!terminal(r)&&r.follow?r.follow.date:'',!terminal(r)&&r.follow?r.follow.time:'']);const blob=new Blob(['\ufeff'+[headings,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Ayaan-Interiors-Sample-Enquiries-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Sample enquiries exported as CSV.')}
function changeStage(r,s){if(!STAGES.includes(s))return;if(s==='Quotation sent'&&!r.quote){notify('Prepare and save a quotation first.');render();return}if(s==='Quotation sent'&&r.quote.status!=='Shared manually'){notify('Use “Mark shared manually” after reviewing the saved quotation.');render();return}if(s==='Won'||s==='Closed'){openModal({type:'terminal',id:r.id,stage:s});render();return}const prev=r.stage;r.stage=s;if(prev==='Consultation'&&s!=='Consultation'&&r.consult&&!r.consult.done){r.consult.done=true;log(r,'Consultation archived when stage changed to '+s)}log(r,'Stage changed from '+prev+' to '+s);save();render();notify('Stage updated.')}
document.addEventListener('click',async e=>{const p=e.target.closest('[data-page]');if(p){e.preventDefault();page=p.dataset.page;menu=false;search='';filter='All stages';render();window.scrollTo(0,0);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,r=record(id);if(['submit-new','submit-note','submit-quote','submit-schedule'].includes(a))return;e.preventDefault();if(a==='overlay-close'&&e.target!==b)return;if(a==='modal-overlay-close'&&e.target!==b)return;
switch(a){case'menu':menu=!menu;render();break;case'about':openModal({type:'about'});break;case'inbox':openModal({type:'inbox'});break;case'new':if(records.length>=250){notify('This trial supports up to 250 sample enquiries.');break}openModal({type:'new'});break;case'sample-create':if(records.length>=250){notify('This trial supports up to 250 sample enquiries.');break}openModal({type:'new',sample:true});break;case'close-modal':case'modal-overlay-close':closeModal();break;case'close-drawer':case'overlay-close':closeDrawer();break;case'open':openRecord(id);break;case'open-quote':openRecord(id,'quotation');break;case'detail-quote':detailTab='quotation';render();document.querySelector('.drawer').scrollTop=0;break;case'detail-tab':detailTab=b.dataset.tab;renderLayers();break;case'view':view=b.dataset.view;render();break;case'metric':page=b.dataset.target;search='';filter='All stages';render();window.scrollTo(0,0);break;case'dismiss-guide':guideDismissed=true;write(GUIDE,'1');render();break;case'consult':case'follow':if(r&&!terminal(r))openModal({type:a,id});break;case'quick-date':document.querySelector('#schedule-date').value=plus(today(),Number(b.dataset.days));break;case'complete-consult':if(r&&upcomingConsult(r)){r.consult.done=true;r.stage='Design & quote';log(r,'Consultation completed. Next step: prepare design proposal and quotation.');save();render();notify('Consultation completed. Ready for design & quote.')}break;case'complete-follow':if(r?.follow){log(r,'Follow-up completed: '+r.follow.note);r.follow=null;save();render();notify('Follow-up completed.')}break;case'add-line':{let lines=document.querySelector('#quote-lines');let n=lines.children.length;if(n>=20){notify('A quotation supports up to 20 line items.');break}lines.insertAdjacentHTML('beforeend',quoteLine({label:'',qty:1,rate:0},n));renumberLines();updateTotals();break}case'remove-line':{const lines=document.querySelector('#quote-lines');if(lines.children.length<=1){notify('Keep at least one line item.');break}b.closest('[data-line]').remove();renumberLines();updateTotals();break}case'share-quote':if(r?.quote&&!terminal(r)){r.quote.status='Shared manually';r.stage='Quotation sent';if(upcomingConsult(r))r.consult.done=true;log(r,'Quotation marked shared manually. No message was sent by the trial.');save();render();notify('Marked shared manually. No message sent.')}break;case'print':printQuote(r);break;case'reply':if(r)openModal({type:'reply',id});break;case'copy-reply':{const text=document.querySelector('#reply-text').value;try{await navigator.clipboard.writeText(text);notify('Reply copied. Review and paste into WhatsApp yourself.')}catch{document.querySelector('#reply-text').select();notify('Select and copy the draft manually; clipboard access is unavailable.')}break}case'export':exportCSV();break;case'reset':openModal({type:'reset'});break;case'confirm-reset':records=seed();recovered=false;guideDismissed=false;write(GUIDE,'0');save();drawerId=null;modal=null;search='';filter='All stages';page='overview';document.body.classList.remove('no-scroll');render();window.scrollTo(0,0);notify('Sample projects and walkthrough restored.');break;case'confirm-terminal':{const t=record(modal.id);if(!t)break;const stage=modal.stage;t.stage=stage;t.follow=null;if(t.consult&&!t.consult.done)t.consult.done=true;log(t,'Sample project marked '+stage+'. Open reminders cleared; history retained.');save();modal=null;render();notify('Sample status updated.');break}}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const rows=filtered();document.querySelector('#results').innerHTML=view==='list'?projectTable(rows):board(rows);document.querySelector('#result-count').textContent=rows.length+(rows.length===1?' enquiry':' enquiries')}if(e.target.closest('#quote-form'))updateTotals()});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='stage-filter'){filter=e.target.value;const rows=filtered();document.querySelector('#results').innerHTML=view==='list'?projectTable(rows):board(rows);document.querySelector('#result-count').textContent=rows.length+(rows.length===1?' enquiry':' enquiries')}if(id==='assignee'){const r=record(e.target.dataset.record);if(r&&TEAM.includes(e.target.value)){r.assignee=e.target.value;log(r,'Assigned to '+r.assignee);save();render();notify('Sample designer updated.')}}if(id==='stage'){const r=record(e.target.dataset.record);if(r)changeStage(r,e.target.value)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const data=new FormData(f);if(f.id==='new-form'){const d={name:String(data.get('name')).trim(),project:String(data.get('project')),location:String(data.get('location')).trim(),budget:Number(data.get('budget')||0),area:String(data.get('area')).trim(),brief:String(data.get('brief')).trim(),assignee:String(data.get('assignee')),source:modal.sample?'WhatsApp (manual sample)':'Manual entry (sample)'};const r=makeRecord(d);if(!d.brief||!validRecord(r)){document.querySelector('#new-error').innerHTML='<p class="error">Please check the name, location, brief and budget.</p>';return}records.unshift(r);save();modal=null;drawerId=r.id;detailTab='overview';guideDismissed=true;write(GUIDE,'1');render();notify('Enquiry added manually. Ready for a discovery call.');return}const r=record(f.dataset.record);if(!r)return;if(f.id==='schedule-form'){if(terminal(r))return;const date=String(data.get('date')),time=String(data.get('time')),note=String(data.get('note')).trim(),mode=String(data.get('mode')||'');if(!validDate(date)||date<today()||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)||!note||(f.dataset.kind==='consult'&&!MODES.includes(mode))){document.querySelector('#schedule-error').innerHTML='<p class="error">Choose a valid date, time and next action.</p>';return}if(f.dataset.kind==='consult'){if(r.follow&&['New enquiry','Consultation'].includes(r.stage)){log(r,'Previous next action archived: '+r.follow.note);r.follow=null}if(r.consult)log(r,'Previous consultation record: '+r.consult.mode+' · '+r.consult.date+' '+r.consult.time+' · '+r.consult.note);r.consult={date,time,mode,note,done:false};r.stage='Consultation';log(r,mode+' scheduled for '+date+' at '+time+'. '+note)}else{r.follow={date,time,note};log(r,'Follow-up scheduled for '+date+' at '+time+'. '+note)}save();modal=null;render();notify(f.dataset.kind==='consult'?'Consultation saved to the agenda.':'Follow-up saved to the agenda.');return}if(f.id==='note-form'){const text=String(data.get('text')).trim();if(!text){notify('Write a note before saving.');return}r.notes.unshift({text,at:stamp()});r.notes=r.notes.slice(0,100);log(r,'Project note added: '+text);save();render();notify('Project note saved.');return}if(f.id==='quote-form'){const q=currentQuote();if(!validQuote(q)||quoteTotal(q).total<=0){document.querySelector('#quote-error').innerHTML='<p class="error">Add valid descriptions and quantities, and keep the quotation total above zero and below LKR 1 billion.</p>';return}if(r.quote?.status==='Shared manually')log(r,'Previous shared quotation r'+r.quote.revision+': '+money(quoteTotal(r.quote).total));r.quote=q;if(!terminal(r)){r.stage='Design & quote';if(upcomingConsult(r)){r.consult.done=true;log(r,'Consultation archived as the enquiry moved to design & quote.')}}log(r,'Quotation draft r'+q.revision+' saved: '+money(quoteTotal(q).total)+' (sample pricing).');save();render();notify('Quotation saved. Review, then share it manually.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)closeModal();else if(drawerId)closeDrawer();else if(menu){menu=false;render()}return}if(e.key!=='Tab'||(!modal&&!drawerId))return;const root=document.querySelector(modal?'.modal':'.drawer');const els=[...root.querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')].filter(el=>!el.disabled&&el.getClientRects().length);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&lastDay!==today()){lastDay=today();if(!modal&&!drawerId)render()}});
render();
</script></body></html>
