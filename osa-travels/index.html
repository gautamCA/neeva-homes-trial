const SYMBOLS={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',inbox:'<path d="M4 4h16l2 10v6H2v-6L4 4Z"/><path d="M2 14h6l2 3h4l2-3h6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/>',chart:'<path d="M4 3v18h17M8 16v-4M13 16V8M18 16V5"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',leaf:'<path d="M20 3C6 2 1 9 5 16s16 3 15-13Z"/><path d="M4 21 16 8"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',wave:'<path d="M2 9c3-4 6 4 10 0s7 4 10 0M2 15c3-4 6 4 10 0s7 4 10 0"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 14a4 4 0 0 1 3 4v2"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',print:'<path d="M6 9V3h12v6M6 17H3V9h18v8h-3"/><rect x="6" y="14" width="12" height="7"/><path d="M17 12h.01"/>',reset:'<path d="M3 10a9 9 0 1 1 1 8M3 4v6h6"/>',message:'<path d="M21 12a9 9 0 0 1-9 9 10 10 0 0 1-4-.8L3 21l.8-5A9 9 0 1 1 21 12Z"/><path d="M7 9h10M7 13h7"/>',edit:'<path d="m16 3 5 5-12 12-6 1 1-6L16 3ZM13 6l5 5"/>'};
function icon(n){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${SYMBOLS[n]||SYMBOLS.inbox}</svg>`}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Costa_Rica',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(t=>parts.find(p=>p.type===t).value).join('-')}
function dayPlus(s,n){const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function fmt(s,full=false){if(!s)return 'Sin fecha';return new Intl.DateTimeFormat('es-CR',{day:'numeric',month:full?'long':'short',...(full?{year:'numeric'}:{}),timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'))}
function money(v,c='USD'){return new Intl.NumberFormat('es-CR',{style:'currency',currency:c,maximumFractionDigits:2}).format(v)}
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s/g,'')}
function stamp(){return new Date().toISOString()}
function seed(){let t=today();const data=[
['demo-1','Familia Rivera','España',TOUR_OPTIONS[0],4,10,'Cotizada',0,'Revisar la propuesta de snorkel','Prefieren una excursión tranquila. Confirmar disponibilidad antes de reservar.',95],
['demo-2','Pareja Martin','Francia',TOUR_OPTIONS[2],2,7,'Nueva',0,'Confirmar intereses y fecha','Primera visita a Costa Rica; consultan por Corcovado.',0],
['demo-3','Grupo Bennett','Reino Unido',TOUR_OPTIONS[1],3,12,'Seguimiento',-1,'Consultar decisión sobre la propuesta','Solicitan información sobre buceo; requisitos por verificar.',135],
['demo-4','Familia Solís','Costa Rica',TOUR_OPTIONS[3],5,5,'En revisión',1,'Revisar fecha solicitada','Viajan con dos menores. El precio de ejemplo no distingue edades.',0],
['demo-5','Pareja Weber','Alemania',TOUR_OPTIONS[4],2,9,'Confirmada',null,'','Estado confirmado solo como ejemplo; no existe reserva real.',75],
['demo-6','Grupo Laurent','Canadá',TOUR_OPTIONS[5],4,14,'Cotizada',2,'Revisar propuesta privada','Quieren una experiencia privada. Todo importe es ilustrativo.',145],
['demo-7','Pareja Silva','Portugal',TOUR_OPTIONS[7],2,18,'Seguimiento',0,'Revisar preferencias del itinerario','Buscan combinar naturaleza y tiempo libre.',180],
['demo-8','Grupo Costa','Brasil',TOUR_OPTIONS[6],3,8,'Cerrada',null,'','Solicitud cerrada de ejemplo: cambio de planes.',0]
];return data.map((x,i)=>({id:x[0],name:x[1],country:x[2],tour:x[3],people:x[4],travel:dayPlus(t,x[5]),stage:x[6],follow:x[7]===null?'':dayPlus(t,x[7]),action:x[8],notes:[{text:x[9],at:stamp()}],language:['Español','Inglés','Inglés','Español','Inglés','Inglés','Inglés','Español'][i],source:i%3===0?'Web (ejemplo)':'WhatsApp (ejemplo)',quote:{unit:x[10],extra:0,label:'Ajuste ilustrativo',currency:'USD'},log:[{text:'Consulta ficticia preparada para la demostración',at:stamp()}]}))}
let storageOK=true;function get(k){try{return localStorage.getItem(k)}catch{storageOK=false;return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch{storageOK=false;toast('No se pudo guardar en este navegador. Los cambios duran esta sesión.')}}
function remove(k){try{localStorage.removeItem(k)}catch{storageOK=false}}
function validDate(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v+'T12:00:00Z'))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v}
function validRecord(r){const txt=(v,n)=>typeof v==='string'&&v.length<=n;const event=e=>e&&txt(e.text,2000)&&typeof e.at==='string'&&!isNaN(Date.parse(e.at));return r&&txt(r.id,100)&&txt(r.name,70)&&r.name.trim()&&txt(r.country,50)&&['Español','Inglés'].includes(r.language)&&txt(r.source,80)&&STAGES.includes(r.stage)&&TOUR_OPTIONS.includes(r.tour)&&Number.isInteger(r.people)&&r.people>0&&r.people<=50&&validDate(r.travel)&&(r.follow===''||validDate(r.follow))&&txt(r.action,140)&&Array.isArray(r.notes)&&r.notes.every(event)&&Array.isArray(r.log)&&r.log.every(event)&&r.quote&&['USD','CRC'].includes(r.quote.currency)&&Number.isFinite(r.quote.unit)&&r.quote.unit>=0&&r.quote.unit<=10000000&&Number.isFinite(r.quote.extra)&&r.quote.extra>=0&&r.quote.extra<=10000000&&txt(r.quote.label,80)}
function load(){const raw=get(STORE);if(raw){try{const v=JSON.parse(raw);if(['1.0.0','1.1.0',VERSION].includes(v.version)&&Array.isArray(v.records)&&v.records.length<=500&&v.records.every(validRecord)&&new Set(v.records.map(r=>r.id)).size===v.records.length)return v.records}catch{}}return seed()}
let records=load(),view='dashboard',search='',stageFilter='all',tourFilter='all',selected=null,tab='list',guideStep=-1,lastFocus=null;
function persist(){set(STORE,JSON.stringify({version:VERSION,records}))}
function active(r){return !['Confirmada','Cerrada'].includes(r.stage)}
function due(r){return active(r)&&r.follow&&r.follow<=today()}
function amount(r){return Math.round((r.people*r.quote.unit+r.quote.extra)*100)/100}
function badge(r){return `<span class="pill ${slug(r.stage)}">${esc(r.stage)}</span>`}
function dateLabel(r){if(!active(r))return '<span class="muted">Sin pendiente</span>';if(!r.follow)return '<span class="muted">Sin programar</span>';let t=today();return `<span class="follow-date ${r.follow<t?'late':r.follow===t?'today':''}">${r.follow<t?'Vencido · ':r.follow===t?'Hoy · ':''}${fmt(r.follow)}</span>`}
function initials(n){return n.split(' ').slice(0,2).map(x=>x[0]).join('')}
function log(r,text){r.log.unshift({text,at:stamp()})}
function options(items,value){return items.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function filtered(){let q=search.toLocaleLowerCase();return records.filter(r=>(stageFilter==='all'||(stageFilter==='pending'?due(r):stageFilter==='active'?active(r):r.stage===stageFilter))&&(tourFilter==='all'||r.tour===tourFilter)&&(!q||[r.name,r.country,r.tour,r.stage].some(v=>v.toLocaleLowerCase().includes(q))))}
function brand(){return `<div class="brand"><div class="brandmark">${icon('wave')}</div><div><strong>Osa Travels</strong><span>CONSULTAS & AVENTURAS</span></div></div>`}
function art(){return `<div class="sea-art" aria-hidden="true"><svg viewBox="0 0 420 245" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a5654"/><stop offset="1" stop-color="#123e40"/></linearGradient></defs><rect width="420" height="245" fill="url(#sea)"/><circle cx="324" cy="55" r="25" fill="#cbdca7" opacity=".65"/><path d="M60 112 118 46 168 101 223 31 301 111 420 70v110H60Z" fill="#306d61"/><path d="m128 104 81-59 81 55 75-30 70 85-7 91H10Z" fill="#498477"/><path d="M0 162c50-32 96-5 135-34s101-9 132-27 88-2 153 44v100H0Z" fill="#84a789"/><path d="M0 174c58-39 88 10 140-18s100-29 138-36 82 20 142 39v86H0Z" fill="#ccd0a3"/><path d="M0 185c52-38 105 12 146-13s93-30 136-33 101 16 138 43v63H0Z" fill="#287b72"/><path d="M0 213c62-38 124 8 179-18s159-9 241 22v28H0Z" fill="#1c655f"/><path d="M45 207c50-20 103 8 150-15s91-8 130 7" stroke="#b5d3b5" stroke-width="1" fill="none" opacity=".3"/><path d="M239 217c24-10 46-8 71-3" stroke="#b5d3b5" stroke-width="1" fill="none" opacity=".4"/><path d="M40 37c19-5 31-5 42 0M353 34c9-4 21-4 33 1" stroke="#afcaaa" opacity=".25" fill="none"/><path d="M20 214c80-63 152 2 202-57" stroke="#e4dfb8" stroke-width="1.5" stroke-dasharray="4 5" fill="none" opacity=".7"/><circle cx="222" cy="157" r="4" fill="#e7e1b9"/><circle cx="20" cy="214" r="3" fill="#e7e1b9"/></svg><span class="hero-tag">Bahía Ballena · Costa Rica</span></div>`}
function layout(){let pending=records.filter(due).length;return `<div class="layout"><aside class="sidebar" id="sidebar">${brand()}<div class="workspace"><span class="dot"></span>Espacio de prueba <span class="muted">· Osa</span></div><nav class="nav" aria-label="Navegación principal">${[['dashboard','dashboard','Vista general'],['consultas','inbox','Consultas'],['agenda','calendar','Seguimientos'],['report','chart','Resumen']].map(([v,i,n])=>`<button data-view="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${icon(i)}${n}${v==='agenda'&&pending?`<span class="count">${pending}</span>`:''}</button>`).join('')}</nav><div class="sidebarfoot"><div class="sidecard"><div class="eyebrow">Pruébalo en 2 minutos</div><p>De una consulta a su próximo seguimiento. Sin configurar nada.</p><button class="btn soft small" data-action="guide">${icon('arrow')}Recorrido guiado</button></div><div class="credit">Concepto por <b>Silicon Soul</b></div></div></aside><div class="content"><header class="topbar"><div class="flex"><button class="iconbtn mobilemenu" data-action="menu" aria-label="Abrir navegación">${icon('menu')}</button><div class="breadcrumbs"><span>Osa Travels</span><span>/</span><b>${{'dashboard':'Vista general','consultas':'Consultas','agenda':'Seguimientos','report':'Resumen'}[view]}</b></div></div><div class="flex"><span class="topdate">${fmt(today(),true)}</span><span class="badge">CONCEPTO · DATOS FICTICIOS</span><div class="avatar" aria-label="Equipo de ejemplo">OT</div></div></header><div class="demo-banner">${icon('info')}<span>Demostración de Silicon Soul para Osa Travels. Datos y precios ficticios · ${storageOK?'Los cambios se guardan solo en este navegador.':'Guardado local no disponible: cambios solo durante esta sesión.'}</span></div><main class="main" id="main" tabindex="-1">${page()}<footer class="footer"><span>Concepto independiente · No es un sistema de reservas ni una cuenta oficial.</span><div class="flex wrap"><button class="btn small" data-action="about">Sobre esta prueba</button><a href="https://siliconsoul.continuumarc.tech" target="_blank" rel="noopener">Silicon Soul ↗</a></div></footer></main></div></div>`}
function heading(title,sub,add=true){return `<div class="pagehead flex between"><div><div class="eyebrow">El siguiente paso, siempre visible</div><h1>${title}</h1><p>${sub}</p></div>${add?`<button class="btn primary" data-action="new">${icon('plus')}Nueva consulta</button>`:''}</div>`}
function metrics(){let a=records.filter(active).length,p=records.filter(due).length,q=records.filter(r=>r.stage==='Cotizada').length,c=records.filter(r=>r.stage==='Confirmada').length;return `<div class="stats">${[['Consultas activas',a,'Por avanzar al siguiente paso','inbox','active'],['Requieren seguimiento',p,'Hoy o con fecha vencida','clock','pending'],['Propuestas por decidir',q,'Cotizaciones de ejemplo','message','Cotizada'],['Confirmadas',c,'Estado ilustrativo, sin reserva real','check','Confirmada']].map(([n,v,b,i,f],idx)=>`<button class="stat ${idx===1?'warn':''}" data-filter="${f}"><span class="stat-top">${n}${icon(i)}</span><span class="stat-num">${v}</span><span class="stat-bottom">${b}</span></button>`).join('')}</div>`}
function tableSection(){let rows=filtered();return `<section><div class="sectionhead"><div><h2>${view==='dashboard'?'Cada consulta, en su lugar':'Tus consultas'}</h2><p>Viajeros, fechas y el próximo paso de cada solicitud.</p></div><div class="flex"><div class="viewtabs" aria-label="Vista de consultas"><button data-tab="list" class="${tab==='list'?'selected':''}" aria-pressed="${tab==='list'}">Lista</button><button data-tab="board" class="${tab==='board'?'selected':''}" aria-pressed="${tab==='board'}">Etapas</button></div><button class="iconbtn" data-action="export" aria-label="Exportar consultas a CSV" title="Exportar CSV">${icon('download')}</button></div></div><div class="panel"><div class="toolbar"><div class="searchbox">${icon('search')}<input class="input" id="search" type="search" placeholder="Buscar viajero, país o experiencia…" aria-label="Buscar consultas" value="${esc(search)}"></div><select id="stagefilter" class="input" aria-label="Filtrar por etapa"><option value="all">Todas las etapas</option><option value="active" ${stageFilter==='active'?'selected':''}>Consultas activas</option><option value="pending" ${stageFilter==='pending'?'selected':''}>Requieren seguimiento</option>${options(STAGES,stageFilter)}</select><select id="tourfilter" class="input" aria-label="Filtrar por experiencia"><option value="all">Todas las experiencias</option>${options(TOUR_OPTIONS,tourFilter)}</select></div><div id="results">${tab==='board'?board(rows):tableRows(rows)}</div><div class="panel-bottom"><span id="result-count">${rows.length} de ${records.length} consultas</span><span>Hoy en Costa Rica · ${fmt(today())}</span></div></div></section>`}
function tableRows(rows){if(!rows.length)return `<div class="empty">${icon('search')}No hay consultas con estos filtros.<br><button class="btn small" style="margin-top:15px" data-action="clearfilters">Mostrar todas</button></div>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>Viajero</th><th>Experiencia</th><th>Etapa</th><th class="optional">Viaje</th><th>Seguimiento</th><th><span class="muted">Abrir</span></th></tr></thead><tbody>${rows.map(r=>`<tr data-open="${esc(r.id)}"><td><div class="person"><span class="person-avatar">${esc(initials(r.name))}</span><div><b>${esc(r.name)}</b><small>${esc(r.country)} · ${r.people} viajeros</small></div></div></td><td><span class="tourname">${esc(r.tour)}</span><span class="subline">${esc(r.source)}</span></td><td>${badge(r)}</td><td class="optional"><span class="follow-date">${fmt(r.travel)}</span></td><td>${dateLabel(r)}</td><td><button class="rowopen" data-open="${esc(r.id)}" aria-label="Abrir consulta de ${esc(r.name)}">Ver ${icon('chevron')}</button></td></tr>`).join('')}</tbody></table></div><div class="mobilecards">${rows.map(r=>`<button class="mobilelead" data-open="${esc(r.id)}"><span class="flex"><span class="person"><span class="person-avatar">${esc(initials(r.name))}</span><span><b>${esc(r.name)}</b><small>${esc(r.country)} · ${r.people} viajeros</small></span></span>${badge(r)}</span><span class="tourname">${esc(r.tour)}</span><span class="flex"><span class="subline">Viaje · ${fmt(r.travel)}</span>${dateLabel(r)}</span></button>`).join('')}</div>`}
function board(rows){return `<div class="kanban" aria-label="Consultas por etapa">${STAGES.map(s=>{let list=rows.filter(r=>r.stage===s);return `<section class="column"><div class="column-head"><span>${esc(s)}</span><small>${list.length}</small></div>${list.map(r=>`<button class="leadcard" data-open="${esc(r.id)}"><h3>${esc(r.name)}</h3><p>${esc(r.tour)}<br>${r.people} viajeros · ${fmt(r.travel)}</p><div class="leadcard-foot">${dateLabel(r)}${icon('chevron')}</div></button>`).join('')||'<div class="empty" style="padding:20px 4px;font-size:11px">Sin consultas en esta etapa</div>'}</section>`}).join('')}</div>`}
function dashboard(){let tasks=records.filter(due).sort((a,b)=>a.follow.localeCompare(b.follow)).slice(0,3);let tours=TOUR_OPTIONS.map(t=>({t,n:records.filter(r=>r.tour===t&&active(r)).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,3);return `${heading('Una vista clara de cada aventura.','Organiza las consultas. Prepara el próximo paso. Conserva el trato personal.')}<section class="hero"><div class="herocopy"><div class="eyebrow">Menos búsqueda. Más claridad.</div><h2>Buenas conversaciones.<br>Seguimientos bien cuidados.</h2><p>Un espacio para acompañar cada consulta, desde el primer interés hasta la decisión del viajero.</p><button class="btn small" data-action="guide">Explorar el concepto ${icon('arrow')}</button></div>${art()}</section>${metrics()}${tableSection()}<div class="bottomgrid"><section class="mini-panel"><div class="flex between"><div class="eyebrow">Próximas conversaciones</div>${icon('calendar')}</div>${tasks.map(r=>`<div class="taskrow"><div><b>${esc(r.name)}</b><small>${esc(r.action||'Definir el próximo paso')}</small></div><button class="btn small" data-open="${esc(r.id)}">${r.follow<today()?'Vencido':'Hoy'} ${icon('chevron')}</button></div>`).join('')||'<p class="muted" style="font-size:12px">Todo al día. No hay seguimientos pendientes.</p>'}</section><section class="mini-panel"><div class="flex between"><div class="eyebrow">Interés de los viajeros</div>${icon('leaf')}</div>${tours.map(x=>`<div class="taskrow"><div><b>${esc(x.t)}</b><small>Consultas activas de ejemplo</small></div><span class="pill seguimiento">${x.n}</span></div>`).join('')||'<p class="muted" style="font-size:12px">Sin consultas activas.</p>'}</section></div>`}
function agenda(){let t=today(),list=records.filter(r=>active(r));let groups=[['Vencidos',list.filter(r=>r.follow&&r.follow<t)],['Para hoy',list.filter(r=>r.follow===t)],['Próximos',list.filter(r=>r.follow>t)],['Sin programar',list.filter(r=>!r.follow)]];return `${heading('El próximo paso no se pierde.','Agenda de seguimiento · Fechas calculadas para Costa Rica.')}<div class="stack">${groups.map(([title,rs])=>`<section class="agenda-group"><h3>${title} · ${rs.length}</h3>${rs.sort((a,b)=>a.follow.localeCompare(b.follow)).map(r=>`<div class="agenda-card"><div class="flex"><div class="day-square">${r.follow?Number(r.follow.slice(-2)):icon('calendar')}</div><div><h3>${esc(r.name)}</h3><p>${esc(r.action||'Definir el próximo paso')} · ${esc(r.tour)}</p><div style="margin-top:8px">${dateLabel(r)}</div></div></div><button class="btn small" data-open="${esc(r.id)}">Ver consulta ${icon('arrow')}</button></div>`).join('')||'<div class="panel empty" style="padding:19px">Sin seguimientos en este grupo.</div>'}</section>`).join('')}</div>`}
function report(){let totals={USD:0,CRC:0};records.filter(r=>active(r)).forEach(r=>totals[r.quote.currency]+=amount(r));let tours=TOUR_OPTIONS.map(t=>({t,n:records.filter(r=>r.tour===t).length}));return `${heading('Un resumen para decidir con calma.','La vista cambia con tus consultas. Todas las cifras corresponden a esta prueba.',false)}${metrics()}<div class="reportgrid"><section class="report-panel"><h2>Distribución por etapa</h2>${STAGES.map(s=>{let n=records.filter(r=>r.stage===s).length;return `<div class="barrow"><div class="flex"><span>${esc(s)}</span><b>${n}</b></div><div class="bar"><span style="width:${records.length?n/records.length*100:0}%"></span></div></div>`}).join('')}</section><section class="report-panel"><h2>Experiencias consultadas</h2>${tours.filter(x=>x.n).map(x=>`<div class="barrow"><div class="flex"><span>${esc(x.t)}</span><b>${x.n}</b></div><div class="bar"><span style="width:${records.length?x.n/records.length*100:0}%"></span></div></div>`).join('')||'<div class="empty">Sin datos.</div>'}</section><section class="report-panel"><h2>Importes ilustrativos abiertos</h2><p class="muted" style="font-size:11px;margin:12px 0">Calculados por moneda, sin conversión.</p><div class="flex wrap" style="gap:25px">${Object.entries(totals).map(([c,v])=>`<div><small class="muted">${c}</small><div style="font-size:25px;font-weight:600;margin-top:6px">${money(v,c)}</div></div>`).join('')}</div><div class="reportnote">No son ingresos, reservas ni precios oficiales de Osa Travels. Solo representan las cotizaciones ficticias de las consultas activas.</div></section><section class="report-panel"><h2>Tu equipo sigue al mando</h2><div class="reportnote">El concepto organiza el trabajo interno. La conversación con el viajero sigue siendo personal. No envía mensajes, verifica disponibilidad ni realiza cobros.</div><button class="btn small" style="margin-top:20px" data-action="export">${icon('download')}Exportar datos de prueba</button></section></div>`}
function page(){return view==='dashboard'?dashboard():view==='consultas'?`${heading('De la consulta a la decisión.','Todos los detalles de cada viajero, reunidos en un solo lugar.')}${tableSection()}`:view==='agenda'?agenda():report()}
function render(){document.getElementById('app').innerHTML=layout();bindFilters()}
function bindFilters(){let s=document.getElementById('search');if(s)s.addEventListener('input',()=>{search=s.value;updateResults()});for(const [id,key] of [['stagefilter','stage'],['tourfilter','tour']]){let el=document.getElementById(id);if(el)el.addEventListener('change',()=>{if(key==='stage')stageFilter=el.value;else tourFilter=el.value;updateResults()})}}
function updateResults(){let rs=filtered();document.getElementById('results').innerHTML=tab==='board'?board(rs):tableRows(rs);document.getElementById('result-count').textContent=`${rs.length} de ${records.length} consultas`}
function toast(s){let el=document.getElementById('toast');el.innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.innerHTML='',3500)}
function setView(v){view=v;search='';stageFilter='all';tourFilter='all';render();window.scrollTo({top:0,behavior:'smooth'})}
function focusFirst(root){let el=root.querySelector('button,input,select,textarea,a');if(el)el.focus()}
function openModal(html){lastFocus=document.activeElement;document.getElementById('modal-layer').innerHTML=`<div class="modalwrap"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</section></div>`;document.body.classList.add('no-scroll');focusFirst(document.getElementById('modal-layer'))}
function closeModal(){if(document.querySelector('.welcome-art'))set(GUIDE,'seen');document.getElementById('modal-layer').innerHTML='';if(!selected)document.body.classList.remove('no-scroll');if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function modalHead(t){return `<div class="modal-head"><h2 id="modal-title">${t}</h2><button class="iconbtn" data-action="closemodal" aria-label="Cerrar">${icon('close')}</button></div>`}
function welcome(){openModal(`${modalHead('Una pequeña prueba. Una vista más clara.')}<div class="welcome-art"><div class="brandmark">${icon('wave')}</div><div><h3>Preparado para Osa Travels</h3><span>Consultas, cotizaciones y seguimientos.<br>Un concepto de Silicon Soul.</span></div></div><p>Explora cómo podría acompañarse una solicitud desde el primer interés hasta el siguiente contacto. Todo funciona con datos ficticios y puedes probarlo libremente.</p><div class="welcome-steps"><div class="welcome-step"><b>01 · EXPLORA</b>Abre una consulta y revisa sus detalles.</div><div class="welcome-step"><b>02 · PREPARA</b>Modifica una cotización de ejemplo.</div><div class="welcome-step"><b>03 · ACOMPAÑA</b>Programa el siguiente contacto.</div></div><p class="disclosure">Datos y precios ficticios. No hay conexión con WhatsApp ni reservas reales. Usa solo datos de prueba: este concepto guarda cambios en tu navegador, sin acceso compartido.</p><div class="flex between wrap"><button class="btn" data-action="explore">Explorar por mi cuenta</button><button class="btn primary" data-action="startguide">Iniciar recorrido ${icon('arrow')}</button></div>`)}
function openLead(id){let r=records.find(x=>x.id===id);if(!r)return;let previous=document.querySelector('#layer .drawer'),keep=selected===id,oldScroll=keep&&previous?previous.scrollTop:0,oldAction=keep?document.activeElement?.dataset?.action:null;selected=id;if(!keep)lastFocus=document.activeElement;document.body.classList.add('no-scroll');document.getElementById('layer').innerHTML=`<div class="overlay" ${keep?'style="animation:none"':''}><section class="drawer" ${keep?'style="animation:none"':''} role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-head"><span class="eyebrow muted">Consulta · ${esc(r.id.replace('demo-','OT-'))}</span><button class="iconbtn" data-action="closedrawer" aria-label="Cerrar consulta">${icon('close')}</button></div><div class="flex between"><span class="person-avatar">${esc(initials(r.name))}</span>${badge(r)}</div><h2 class="drawer-title" id="drawer-title">${esc(r.name)}</h2><p class="drawer-sub">${esc(r.country)} · ${r.people} viajeros · ${esc(r.language)}</p><div class="detailbox"><h3>Detalles de la consulta</h3><div class="formgrid"><label class="field full">Experiencia<select class="input" id="lead-tour">${options(TOUR_OPTIONS,r.tour)}</select></label><label class="field">Fecha deseada<input class="input" id="lead-travel" type="date" value="${esc(r.travel)}" required></label><label class="field">Viajeros<input class="input" id="lead-people" type="number" min="1" max="50" step="1" value="${r.people}" required></label><label class="field full">Etapa<select class="input" id="lead-stage" aria-label="Etapa" aria-describedby="stage-hint">${options(STAGES,r.stage)}</select><span class="formhint" id="stage-hint">Confirmada es un estado de prueba; no crea una reserva.</span></label></div><button class="btn small" style="margin-top:14px" data-action="savedetails">${icon('check')}Guardar detalles</button></div><div class="detailbox"><div class="flex between" style="margin-bottom:15px"><h3 style="margin:0">Próximo seguimiento</h3>${icon('calendar')}</div>${!active(r)?'<p class="formhint">Esta consulta no tiene un seguimiento pendiente. Cambia la etapa para retomarla.</p>':`<label class="field">Próxima acción<input class="input" id="lead-action" maxlength="140" value="${esc(r.action)}" placeholder="Ej.: revisar la propuesta con el viajero"></label><div class="flex" style="margin-top:12px"><label class="field" style="flex:1">Fecha<input class="input" id="lead-follow" type="date" value="${esc(r.follow)}"></label><button class="btn small" style="margin-top:22px" data-action="tomorrow">Mañana</button></div><div class="flex wrap" style="margin-top:14px"><button class="btn primary small" data-action="savefollow">Guardar seguimiento</button><button class="btn small" data-action="completefollow">${icon('check')}Marcar realizado</button></div>`}</div><div class="detailbox"><div class="flex between" style="margin-bottom:15px"><h3 style="margin:0">Cotización de ejemplo</h3><span class="badge">PRECIO FICTICIO</span></div><div class="formgrid"><label class="field">Moneda<select class="input" id="quote-currency">${options(['USD','CRC'],r.quote.currency)}</select></label><label class="field">Por viajero<input class="input quoteinput" id="quote-unit" type="number" min="0" max="10000000" step="0.01" value="${r.quote.unit}"></label><label class="field">Ajuste adicional<input class="input quoteinput" id="quote-extra" type="number" min="0" max="10000000" step="0.01" value="${r.quote.extra}"></label><label class="field">Concepto del ajuste<input class="input" id="quote-label" maxlength="80" value="${esc(r.quote.label)}"></label></div><div class="quote-summary"><span class="formhint">${r.people} viajeros · importe ilustrativo</span><div class="quoted-total" id="quote-total">${money(amount(r),r.quote.currency)}</div></div><p class="formhint" style="margin:10px 0">No son tarifas oficiales. Cambiar la moneda no convierte el importe. Disponibilidad, impuestos y condiciones reales requieren verificación.</p><div class="flex wrap"><button class="btn primary small" data-action="savequote">Guardar cotización</button><button class="btn small" data-action="printquote">${icon('print')}Imprimir ejemplo</button><button class="btn small" data-action="reply">${icon('message')}Borrador de respuesta</button></div></div><div class="detailbox"><h3>Notas de la conversación</h3>${r.notes.map(n=>`<div class="note">${esc(n.text)}</div>`).join('')}<label class="field">Añadir nota<textarea class="input" id="new-note" maxlength="1000" placeholder="Solo información ficticia para esta prueba"></textarea></label><button class="btn small" style="margin-top:10px" data-action="addnote">${icon('plus')}Guardar nota</button></div><div class="detailbox"><h3>Actividad en esta prueba</h3>${r.log.slice(0,8).map(l=>`<div class="logrow">${esc(l.text)}<small>${new Intl.DateTimeFormat('es-CR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'America/Costa_Rica'}).format(new Date(l.at))} · Costa Rica</small></div>`).join('')}</div><p class="formhint" style="margin:20px 0;text-align:center">Concepto con datos ficticios · Cambios locales en este navegador</p></section></div>`;document.querySelectorAll('.quoteinput,#quote-currency').forEach(el=>el.addEventListener('input',previewTotal));if(keep&&previous){let focus=oldAction?document.querySelector('#layer [data-action="'+oldAction+'"]'):null;if(focus)focus.focus({preventScroll:true});document.querySelector('#layer .drawer').scrollTop=oldScroll}else focusFirst(document.getElementById('layer'))}
function closeLead(){selected=null;document.getElementById('layer').innerHTML='';if(!document.querySelector('#modal-layer .modal'))document.body.classList.remove('no-scroll');if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function current(){return records.find(r=>r.id===selected)}
function commitLead(r,text){log(r,text);persist();render();openLead(r.id);toast(text)}
function previewTotal(){let r=current();if(!r)return;let u=Number(document.getElementById('quote-unit').value),e=Number(document.getElementById('quote-extra').value),c=document.getElementById('quote-currency').value;document.getElementById('quote-total').textContent=money(r.people*(u||0)+(e||0),c)}
function saveDetails(){let r=current();let travel=document.getElementById('lead-travel'),p=document.getElementById('lead-people');if(!travel.reportValidity()||!p.reportValidity())return;let newstage=document.getElementById('lead-stage').value;r.tour=document.getElementById('lead-tour').value;r.travel=travel.value;r.people=Number(p.value);r.stage=newstage;if(!active(r)){r.follow='';r.action=''}commitLead(r,'Detalles de la consulta actualizados')}
function saveQuote(quiet=false){let r=current();let u=document.getElementById('quote-unit'),e=document.getElementById('quote-extra');if(!u.value||!e.value||!u.reportValidity()||!e.reportValidity()){toast('Revisa los importes de la cotización.');return false}let unit=Number(u.value),extra=Number(e.value);if(!Number.isFinite(unit)||!Number.isFinite(extra)||unit<0||extra<0){toast('Los importes deben ser válidos y no negativos.');return false}r.quote={unit,extra,currency:document.getElementById('quote-currency').value,label:document.getElementById('quote-label').value.trim()||'Ajuste ilustrativo'};log(r,'Cotización ficticia guardada');persist();render();openLead(r.id);if(!quiet)toast('Cotización de ejemplo guardada.');return true}
function saveFollow(){let r=current(),f=document.getElementById('lead-follow').value,a=document.getElementById('lead-action').value.trim();if(!f||!a){toast('Añade una fecha y la próxima acción.');return}r.follow=f;r.action=a;commitLead(r,'Seguimiento programado')}
function newLead(){if(records.length>=500){toast('Límite de la prueba: 500 consultas. Exporta y restablece para continuar.');return}openModal(`${modalHead('Una nueva aventura empieza aquí.')}<p>Añade una consulta ficticia y descubre cómo organizar su siguiente paso.</p><form id="new-form"><div class="formgrid"><label class="field full">Nombre de ejemplo<input class="input" name="name" maxlength="70" required placeholder="Ej.: Familia de prueba"></label><label class="field">País<input class="input" name="country" maxlength="50" required placeholder="Ej.: España"></label><label class="field">Idioma<select class="input" name="language">${options(['Español','Inglés'],'Español')}</select></label><label class="field full">Experiencia<select class="input" name="tour">${options(TOUR_OPTIONS,TOUR_OPTIONS[0])}</select></label><label class="field">Fecha deseada<input class="input" type="date" name="travel" min="${today()}" value="${dayPlus(today(),7)}" required></label><label class="field">Viajeros<input class="input" type="number" name="people" min="1" max="50" step="1" value="2" required></label><label class="field full">Nota inicial<textarea class="input" name="note" maxlength="1000" placeholder="Preferencias ficticias de los viajeros"></textarea></label></div><p class="disclosure">Introduce solo datos de ejemplo. Esta prueba no recibe mensajes ni confirma disponibilidad.</p><div class="flex between"><button class="btn" type="button" data-action="closemodal">Cancelar</button><button class="btn primary" type="submit">Crear consulta ${icon('arrow')}</button></div></form>`);document.getElementById('new-form').addEventListener('submit',ev=>{ev.preventDefault();let f=new FormData(ev.target),name=f.get('name').trim(),country=f.get('country').trim();if(!name||!country){toast('Completa el nombre y el país.');return}let id='ot-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);let r={id,name,country,language:f.get('language'),tour:f.get('tour'),travel:f.get('travel'),people:Number(f.get('people')),stage:'Nueva',source:'Entrada manual (ejemplo)',follow:today(),action:'Revisar la nueva consulta',quote:{unit:0,extra:0,label:'Ajuste ilustrativo',currency:'USD'},notes:f.get('note').trim()?[{text:f.get('note').trim(),at:stamp()}]:[],log:[{text:'Consulta de prueba creada',at:stamp()}]};records.unshift(r);persist();closeModal();view='consultas';stageFilter='all';tourFilter='all';search='';render();openLead(id);toast('Consulta ficticia creada.')})}
function reply(){if(!saveQuote(true))return;let r=current();let text=r.language==='Inglés'?`DEMO — fictional information, not a real offer.\n\nHello! Here is an illustrative proposal for ${r.tour}, for ${r.people} travellers on ${new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(r.travel+'T12:00:00Z'))}.\n\nExample total: ${money(amount(r),r.quote.currency)}. Availability, actual rates and conditions would need confirmation by the Osa Travels team.\n\nWould you like to review the next step?`:`EJEMPLO — información ficticia, no es una oferta real.\n\n¡Hola! Esta es una propuesta ilustrativa para ${r.tour}, para ${r.people} viajeros el ${fmt(r.travel,true)}.\n\nTotal de ejemplo: ${money(amount(r),r.quote.currency)}. El equipo de Osa Travels tendría que confirmar disponibilidad, tarifas y condiciones reales.\n\n¿Te gustaría revisar el siguiente paso?`;openModal(`${modalHead('Un borrador, con atención personal.')}<p>Texto de ejemplo editable. Copiarlo no envía ningún mensaje.</p><label class="field">Borrador<textarea class="input" id="reply-text" rows="10" maxlength="2000">${esc(text)}</textarea></label><div class="flex between wrap" style="margin-top:20px"><button class="btn" data-action="closemodal">Volver</button><button class="btn primary" data-action="copyreply">${icon('copy')}Copiar borrador</button></div>`)}
async function copyReply(){let txt=document.getElementById('reply-text');try{await navigator.clipboard.writeText(txt.value);toast('Borrador copiado. No se ha enviado ningún mensaje.')}catch{txt.focus();txt.select();toast('Selecciona y copia el texto manualmente.')}}
function printQuote(){if(!saveQuote(true))return;let r=current();document.getElementById('quoteprint').innerHTML=`<div class="printbadge">CONCEPTO · COTIZACIÓN FICTICIA</div><h1>Osa Travels · Ejemplo de propuesta</h1><p>Preparado por Silicon Soul para demostrar el flujo de trabajo.<br>No es una cotización oficial ni una confirmación de reserva.</p><p><b>${esc(r.name)}</b><br>${esc(r.tour)}<br>Fecha solicitada: ${fmt(r.travel,true)} · ${r.people} viajeros</p><table><thead><tr><th>Concepto ilustrativo</th><th>Cantidad</th><th>Importe</th></tr></thead><tbody><tr><td>${esc(r.tour)}</td><td>${r.people}</td><td>${money(r.people*r.quote.unit,r.quote.currency)}</td></tr>${r.quote.extra?`<tr><td>${esc(r.quote.label)}</td><td>1</td><td>${money(r.quote.extra,r.quote.currency)}</td></tr>`:''}</tbody></table><div class="printtotal">Total ficticio: ${money(amount(r),r.quote.currency)}</div><p>Los importes son inventados para esta prueba. Disponibilidad, tarifas, impuestos, inclusiones y condiciones deben verificarse con el equipo antes de cualquier oferta real.</p><p>Fecha del ejemplo: ${fmt(today(),true)} · Datos de prueba guardados solo en el navegador.</p>`;window.print();openLead(r.id)}
function exportCSV(){let headers=['Nombre ficticio','País','Idioma','Experiencia','Viajeros','Fecha solicitada','Etapa','Seguimiento','Próxima acción','Moneda','Importe ficticio'];let clean=v=>{let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};let rows=records.map(r=>[r.name,r.country,r.language,r.tour,r.people,r.travel,r.stage,r.follow,r.action,r.quote.currency,amount(r)]);let csv='\uFEFF'+[headers,...rows].map(r=>r.map(clean).join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='Osa-Travels-datos-ficticios-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Datos ficticios exportados.')}
function about(){openModal(`${modalHead('Un concepto para conversar sobre el flujo.')}<p>Esta prueba fue preparada por Silicon Soul para Osa Travels. Muestra un posible espacio de trabajo para consultas, cotizaciones y seguimientos.</p><div class="stack"><div class="disclosure"><b>Puedes probar:</b> crear consultas, cambiar etapas, editar importes ficticios, añadir notas, programar seguimientos, copiar borradores y exportar los datos.</div><div class="disclosure"><b>Alcance de la prueba:</b> datos ficticios y almacenamiento local. No hay usuarios compartidos, integración con WhatsApp, cobros, disponibilidad en tiempo real ni reservas.</div><div class="disclosure"><b>Para una implementación real:</b> se definirían el proceso, los accesos, la infraestructura y las integraciones con su equipo antes de cotizar.</div></div><div class="flex between wrap" style="margin-top:23px"><button class="btn danger small" data-action="reset">${icon('reset')}Restablecer prueba</button><a class="btn primary" href="https://siliconsoul.continuumarc.tech" target="_blank" rel="noopener">Conocer Silicon Soul ${icon('arrow')}</a></div>`)}
function askReset(){openModal(`${modalHead('¿Restablecer los datos de prueba?')}<p>Se eliminarán las consultas y los cambios que hayas añadido en este navegador. Volverán los ocho ejemplos originales y el recorrido inicial.</p><div class="flex between"><button class="btn" data-action="closemodal">Cancelar</button><button class="btn primary" data-action="confirmreset">Restablecer ejemplos</button></div>`)}
const GUIDESTEPS=[{t:'01 · Abre una consulta',p:'Explora la solicitud de la Familia Rivera: viajeros, experiencia, propuesta y próximo contacto.',a:'Abrir consulta',go:()=>openLead('demo-1')},{t:'02 · Prepara una propuesta',p:'Modifica el importe ficticio por viajero y guarda la cotización. También puedes imprimir el ejemplo o copiar un borrador.',a:'Ver cotización',go:()=>{openLead('demo-1');document.getElementById('quote-unit').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('quote-unit').focus()}},{t:'03 · Cuida el próximo paso',p:'Escribe una acción, elige “Mañana” y guarda el seguimiento. La agenda se actualiza con el cambio.',a:'Programar seguimiento',go:()=>{openLead('demo-1');let target=document.getElementById('lead-action')||document.getElementById('lead-stage');target?.scrollIntoView({behavior:'smooth',block:'center'});target?.focus();if(!document.getElementById('lead-action'))toast('Cambia la etapa para retomar el seguimiento de esta consulta.')}},{t:'04 · Mira el conjunto',p:'La agenda reúne los contactos pendientes. Ahora puedes añadir tu propia consulta ficticia y explorar el resto.',a:'Ver seguimientos',go:()=>{closeLead();setView('agenda')}}];
function guide(){if(guideStep<0){document.getElementById('guide-layer').innerHTML='';return}let s=GUIDESTEPS[guideStep];document.getElementById('guide-layer').innerHTML=`<aside class="guide" aria-label="Recorrido guiado"><div class="flex between"><div class="stepsdots">${GUIDESTEPS.map((_,i)=>`<span class="${i<=guideStep?'on':''}"></span>`).join('')}</div><button class="closeguide" data-action="endguide" aria-label="Cerrar recorrido">×</button></div><h3 style="margin-top:14px">${s.t}</h3><p>${s.p}</p><div class="flex between"><button class="btn soft small" data-action="guidego">${s.a}</button><button class="btn small" data-action="guidenext">${guideStep===3?'Terminar':'Siguiente'} ${icon('arrow')}</button></div></aside>`}
function startGuide(){closeModal();set(GUIDE,'seen');guideStep=0;guide()}
function closeMenu(){document.getElementById('sidebar')?.classList.remove('open');document.getElementById('sidebarback')?.remove()}
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-action],[data-view],[data-open],[data-filter],[data-tab]');if(!b){if(ev.target.classList.contains('overlay'))closeLead();if(ev.target.id==='sidebarback')closeMenu();return}if(b.dataset.view){closeMenu();setView(b.dataset.view);return}if(b.dataset.open){openLead(b.dataset.open);return}if(b.dataset.filter){view='consultas';stageFilter=b.dataset.filter;search='';tourFilter='all';render();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}let a=b.dataset.action;switch(a){case 'new':newLead();break;case 'closedrawer':closeLead();break;case 'closemodal':closeModal();break;case 'menu':document.getElementById('sidebar').classList.add('open');if(!document.getElementById('sidebarback'))document.body.insertAdjacentHTML('beforeend','<div class="sidebarback" id="sidebarback"></div>');break;case 'guide':guideStep=0;guide();break;case 'startguide':startGuide();break;case 'explore':set(GUIDE,'seen');closeModal();break;case 'endguide':guideStep=-1;guide();set(GUIDE,'seen');break;case 'guidego':GUIDESTEPS[guideStep].go();break;case 'guidenext':guideStep=guideStep===3?-1:guideStep+1;guide();break;case 'savedetails':saveDetails();break;case 'tomorrow':document.getElementById('lead-follow').value=dayPlus(today(),1);break;case 'savefollow':saveFollow();break;case 'completefollow':{let r=current();r.follow='';r.action='';commitLead(r,'Seguimiento marcado como realizado');break}case 'savequote':saveQuote();break;case 'printquote':printQuote();break;case 'reply':reply();break;case 'copyreply':copyReply();break;case 'addnote':{let r=current(),text=document.getElementById('new-note').value.trim();if(!text){toast('Escribe una nota antes de guardarla.');break}r.notes.unshift({text,at:stamp()});commitLead(r,'Nota añadida');break}case 'export':exportCSV();break;case 'about':about();break;case 'reset':askReset();break;case 'confirmreset':closeModal();closeLead();remove(STORE);remove(GUIDE);records=seed();view='dashboard';search='';stageFilter='all';tourFilter='all';tab='list';guideStep=-1;guide();persist();render();welcome();break;case 'clearfilters':search='';stageFilter='all';tourFilter='all';render();break}});
document.addEventListener('keydown',ev=>{let root=document.querySelector('#modal-layer .modal')||document.querySelector('#layer .drawer');if(ev.key==='Escape'){if(document.querySelector('#modal-layer .modal'))closeModal();else if(selected)closeLead();else closeMenu()}if(ev.key==='Tab'&&root){let els=[...root.querySelectorAll('button,a,input,select,textarea')].filter(el=>!el.disabled);if(!els.length)return;let first=els[0],last=els[els.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});
window.addEventListener('storage',ev=>{if(ev.key===STORE){records=load();render();if(selected){if(records.some(r=>r.id===selected))openLead(selected);else closeLead()}}});
let renderedDay=today();setInterval(()=>{if(today()!==renderedDay){renderedDay=today();render();if(selected)openLead(selected)}},60000);
render();persist();if(!get(GUIDE))welcome();
</script>
</body></html>
